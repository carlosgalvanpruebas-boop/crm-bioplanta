<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrotienda Bioplanta · Análisis de inventario</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v1:#33513a;--v2:#4f7c5a;--v3:#84a38c;--v4:#a9c2af;--vbg:#eaefeb;--vlt:#f4f8f5;--texto:#1a2e1a;--beige:#e6ceab;--vino:#984745}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f0;color:var(--texto);min-height:100vh}
.header{background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo-ico{font-size:26px}
.brand{font-size:15px;font-weight:800}
.brand-sub{font-size:11px;opacity:.8}
.btn-h{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none}

.wrap{max-width:1150px;margin:0 auto;padding:18px 18px 60px}
.loading{text-align:center;padding:80px;color:#888}

.aviso{background:var(--beige);color:var(--v1);border-radius:10px;padding:12px 16px;font-size:12.5px;margin-bottom:16px;line-height:1.5}

.indicadores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.ind{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ind b{display:block;font-size:22px;font-weight:800}
.ind span{font-size:11.5px;color:#777}
.ind.sinstock b{color:var(--vino)}
.ind.proximo b{color:#b8860b}
.ind.sobre b{color:var(--v1)}
.ind.normal b{color:var(--v2)}
.ind.valor b{color:var(--v1);font-size:18px}
.ind.compra b{color:var(--vino)}
.indicadores-valor{margin-bottom:14px}

.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filtros select,.filtros input{border:1.5px solid #d6e2d9;border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit}
.filtros input{flex:1;min-width:180px}
.filtro-chip{background:#fff;border:1.5px solid var(--v3);color:var(--v2);padding:6px 13px;border-radius:16px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.filtro-chip.act{background:var(--v2);color:#fff;border-color:var(--v2)}

.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--vbg);flex-wrap:wrap}
.fila:last-child{border-bottom:none}
.f-info{flex:1;min-width:200px}
.f-prod{font-size:14px;font-weight:800;color:var(--v1)}
.f-meta{font-size:11.5px;color:#888;margin-top:2px}
.f-sedes{font-size:11px;color:#8a8a8a;margin-top:2px}
.f-datos{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.f-num{text-align:center}
.f-num b{display:block;font-size:15px}
.f-num span{font-size:10px;color:#888}
.manual-tag{font-size:9px;color:var(--v2);font-weight:700}
.badge{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap}
.b-sinstock{background:#fde3e2;color:var(--vino)}
.b-proximo{background:var(--beige);color:#8a5a00}
.b-sobre{background:var(--v4);color:var(--v1)}
.b-normal{background:#e6f4ea;color:#256d3b}
.btn-mini{border:none;border-radius:7px;padding:8px 12px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700;background:var(--v2);color:#fff;white-space:nowrap}
.btn-mini.editar{background:var(--vbg);color:var(--v1)}
.editar-box{display:flex;gap:6px;align-items:center;background:var(--vlt);padding:6px 8px;border-radius:8px}
.editar-box input{width:70px;border:1.5px solid #d6e2d9;border-radius:6px;padding:5px 6px;font-size:11.5px;font-family:inherit}
.vacio{text-align:center;padding:40px;color:#999;font-size:13px}

/* === Fase 36: rediseno visual desde cero con los 3 colores oficiales de marca (verde #4f7c5a, vino #984745, beige #E6CEAB), tipografia profesional, logo real y mejor contraste === */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{--vlt:#faf8f4;--gris:#f6f4f0;--texto:#25281f;--beige-lt:#f6ecdd;--vino-lt:#f3e8e7}
html,body{font-family:'Plus Jakarta Sans',Inter,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--vlt)}
button,input,select,textarea{font-family:inherit}
h1,h2,h3{font-weight:800;letter-spacing:-.015em;line-height:1.2;color:var(--v1)}
body,p,td,th,li,label{line-height:1.5}
.brand,.sec-t{font-weight:700;letter-spacing:-.005em}
.brand-sub,.slogan{color:var(--v2);font-weight:500}
.card,.ind,.grp,.box,.form-box,.rowcard,.col,.card-t,.search-box,.pend-header,.pend-card,.intro,.tabla-wrap,.stat-box,.bloqueo{border-radius:14px;border:1px solid #e6e1d6;box-shadow:0 2px 10px rgba(37,40,31,.06)}
button,.btn,.btn-out,.btn-ms,.btn-save,.btn-h-act,.btn-exportar,input,select,textarea{border-radius:10px}
.btn,.btn-save,.btn-h-act,.btn-exportar{font-weight:600;letter-spacing:.01em;transition:transform .12s,box-shadow .12s,background .12s,filter .12s}
.btn:hover,.btn-save:hover,.btn-h-act:hover,.btn-exportar:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(37,40,31,.16);filter:brightness(1.05)}
.btn-out{font-weight:600;border-width:1.5px}
a:focus-visible,button:focus-visible,.btn:focus-visible,.btn-out:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--v2);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}
.brand-logo{height:42px;width:auto;display:block}
.brand-logo-lg{height:60px;width:auto;display:block}

@media (max-width:640px){
  .wrap{padding:14px 12px 48px}
  .header{padding:13px 14px}
  .brand{font-size:14px}
  .card,.ind{padding:16px 14px;overflow-x:auto}
  table{font-size:11.5px}
  th,td{padding:7px 7px}
}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-l">
    <div class="logo-ico">📊</div>
    <div>
      <div class="brand">Análisis de inventario</div>
      <div class="brand-sub">Rotación, cobertura y niveles de compra</div>
    </div>
  </div>
  <a class="btn-h" href="hub.html">← Hub</a>
</div>

<div class="wrap" id="wrap">
  <div class="loading">Cargando...</div>
</div>

<script>
const SUPABASE_URL = 'https://fpqogvxssnoarzgxcitc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ccZF-8tenblFEah5lXfd3w_mYTHMtMC';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SEDES = ['Chigorodó', 'Belén de Bajirá'];
// Fase 40 (20-sep): cuánto debe durar el stock antes de que llegue el
// siguiente pedido — 30 días de stock objetivo + 7 días que se demora el
// proveedor en despachar, confirmado por Carlos.
const DIAS_STOCK_OBJETIVO = 30;
const DIAS_DESPACHO_PROVEEDOR = 7;
const DIAS_COBERTURA_OBJETIVO = DIAS_STOCK_OBJETIVO + DIAS_DESPACHO_PROVEEDOR; // 37

let esSuperAdmin = false;
let puedeEditar = false;
let productos = [];
let filtroEstado = 'todos';
let filtroSede = 'todas';
let filtroTexto = '';
let filtroNecesitaCompra = false;
let orden = 'cobertura';
let editandoCodigo = null;
let valorTotalGeneral = 0;
let valorPorSedeGeneral = {};

function fmtFecha(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString('es-CO', { maximumFractionDigits: 1 });
}
function fmtMoneda(n) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
}
// Convierte un codigo_sap en un id de HTML seguro (por si trae espacios u otros caracteres)
function idSafe(s) {
  return String(s).replace(/[^A-Za-z0-9_-]/g, '_');
}

function calcularEstado(p) {
  const cantidad = Number(p.cantidad) || 0;
  if (cantidad <= 0) return 'sinstock';
  if (p.coberturaDias !== null && p.coberturaDias <= 7) return 'proximo';
  if (p.maximoEfectivo !== null && cantidad > Number(p.maximoEfectivo)) return 'sobre';
  return 'normal';
}

function badgeEstado(estado) {
  const map = {
    sinstock: { txt: 'Sin stock', cls: 'b-sinstock' },
    proximo: { txt: 'Próximo a agotarse', cls: 'b-proximo' },
    sobre: { txt: 'Sobre stock', cls: 'b-sobre' },
    normal: { txt: 'Normal', cls: 'b-normal' },
  }[estado];
  return `<span class="badge ${map.cls}">${map.txt}</span>`;
}

function renderIndicadores(lista) {
  const sinstock = lista.filter(p => calcularEstado(p) === 'sinstock').length;
  const proximo = lista.filter(p => calcularEstado(p) === 'proximo').length;
  const sobre = lista.filter(p => calcularEstado(p) === 'sobre').length;
  const normal = lista.filter(p => calcularEstado(p) === 'normal').length;
  const necesitanCompra = lista.filter(p => (p.sugeridoCompra || 0) > 0).length;
  return `
    <div class="indicadores">
      <div class="ind sinstock"><b>${sinstock}</b><span>Sin stock</span></div>
      <div class="ind proximo"><b>${proximo}</b><span>Próximos a agotarse</span></div>
      <div class="ind sobre"><b>${sobre}</b><span>Sobre stock</span></div>
      <div class="ind normal"><b>${normal}</b><span>Normal</span></div>
      <div class="ind compra"><b>${necesitanCompra}</b><span>Necesitan compra ahora</span></div>
    </div>
  `;
}

// Fase 40 (20-sep): valor total del inventario (costo, no precio de venta) —
// combinado y por sede, pedido explícitamente por Carlos. Se calcula sobre
// TODOS los productos (no sobre la lista ya filtrada por búsqueda/estado),
// igual que renderIndicadores(productos) — es una cifra de cabecera, no
// algo que deba cambiar al buscar un producto puntual.
function renderIndicadoresValor() {
  return `
    <div class="indicadores indicadores-valor">
      <div class="ind valor"><b>${fmtMoneda(valorTotalGeneral)}</b><span>Valor total inventario (costo)</span></div>
      ${SEDES.map(s => `<div class="ind valor"><b>${fmtMoneda(valorPorSedeGeneral[s] || 0)}</b><span>Valor en ${s}</span></div>`).join('')}
    </div>
  `;
}

function aplicarFiltros() {
  let lista = productos.filter(p => {
    if (filtroEstado !== 'todos' && calcularEstado(p) !== filtroEstado) return false;
    if (filtroNecesitaCompra && !((p.sugeridoCompra || 0) > 0)) return false;
    if (filtroSede !== 'todas' && p.sedes[filtroSede] === undefined) return false;
    if (filtroTexto && !(p.producto || '').toLowerCase().includes(filtroTexto.toLowerCase())) return false;
    return true;
  });
  if (orden === 'cobertura') {
    lista = lista.slice().sort((a, b) => {
      const ca = a.coberturaDias === null ? Infinity : a.coberturaDias;
      const cb = b.coberturaDias === null ? Infinity : b.coberturaDias;
      return ca - cb;
    });
  } else if (orden === 'sugerido') {
    lista = lista.slice().sort((a, b) => (b.sugeridoCompra || 0) - (a.sugeridoCompra || 0));
  } else {
    lista = lista.slice().sort((a, b) => (b.ventas30 || 0) - (a.ventas30 || 0));
  }
  return lista;
}

function badgeEstadoTexto(estado) {
  return { sinstock: 'sin stock', proximo: 'próximo a agotarse' }[estado] || estado;
}

function filaEditar(p) {
  const idm = idSafe(p.codigo_sap);
  return `
    <div class="editar-box">
      <input type="number" id="edit-min-${idm}" placeholder="Mínimo" value="${p.stock_minimo_manual !== null && p.stock_minimo_manual !== undefined ? p.stock_minimo_manual : ''}">
      <input type="number" id="edit-max-${idm}" placeholder="Máximo" value="${p.stock_maximo_manual !== null && p.stock_maximo_manual !== undefined ? p.stock_maximo_manual : ''}">
      <button class="btn-mini" onclick="guardarManual('${p.codigo_sap}')">💾</button>
      <button class="btn-mini editar" onclick="editandoCodigo=null; render()">✕</button>
    </div>
  `;
}

function render() {
  const lista = aplicarFiltros();

  const filasHtml = lista.length
    ? lista.map(p => {
        const estado = calcularEstado(p);
        const puedeReportar = estado === 'sinstock' || estado === 'proximo';
        const urlReporte = puedeReportar
          ? `sugerido-compra.html?producto=${encodeURIComponent(p.producto)}&urgencia=${estado === 'sinstock' ? 'Alta' : 'Normal'}&motivo=${encodeURIComponent('Detectado en Análisis de inventario (2.1): ' + badgeEstadoTexto(estado))}`
          : null;
        const minTiene = p.stock_minimo_manual !== null && p.stock_minimo_manual !== undefined;
        const maxTiene = p.stock_maximo_manual !== null && p.stock_maximo_manual !== undefined;
        const desgloseSedes = SEDES.map(s => `${s}: ${p.sedes[s] !== undefined ? fmtNum(p.sedes[s]) : '—'}`).join(' · ');
        const urlReporteConSugerido = urlReporte && p.sugeridoCompra ? `${urlReporte}&cantidad_sugerida=${encodeURIComponent(p.sugeridoCompra)}` : urlReporte;
        return `
          <div class="fila">
            <div class="f-info">
              <div class="f-prod">${p.producto || '(sin nombre)'}</div>
              <div class="f-meta">${p.categoria || 'Sin categoría'} · Actualizado: ${fmtFecha(p.actualizado_en)} · Valor: ${fmtMoneda(p.valorTotal)}</div>
              <div class="f-sedes">📍 ${desgloseSedes}</div>
            </div>
            <div class="f-datos">
              <div class="f-num"><b>${fmtNum(p.cantidad)}</b><span>${p.unidad || 'unid.'} (total)</span></div>
              <div class="f-num"><b>${fmtNum(p.ventas30)}</b><span>venta 30d</span></div>
              <div class="f-num"><b>${p.coberturaDias !== null ? fmtNum(p.coberturaDias) + 'd' : '—'}</b><span>cobertura</span></div>
              <div class="f-num"><b>${p.rotacionMensual !== null ? fmtNum(p.rotacionMensual) + 'x' : '—'}</b><span>rotación/mes</span></div>
              <div class="f-num"><b>${fmtNum(p.minimoEfectivo)}</b>${minTiene ? '<span class="manual-tag">manual</span>' : '<span>mínimo</span>'}</div>
              <div class="f-num"><b>${fmtNum(p.maximoEfectivo)}</b>${maxTiene ? '<span class="manual-tag">manual</span>' : '<span>máximo</span>'}</div>
              <div class="f-num"><b>${p.sugeridoCompra !== null ? fmtNum(p.sugeridoCompra) : '—'}</b><span>sugerido (37d)</span></div>
              ${badgeEstado(estado)}
              ${urlReporteConSugerido ? `<a class="btn-mini" href="${urlReporteConSugerido}">📩 Reportar</a>` : ''}
              ${puedeEditar ? (editandoCodigo === p.codigo_sap ? filaEditar(p) : `<button class="btn-mini editar" onclick="editandoCodigo='${p.codigo_sap}'; render()">✏️ Ajustar</button>`) : ''}
            </div>
          </div>
        `;
      }).join('')
    : '<div class="vacio">No hay productos que coincidan con el filtro.</div>';

  document.getElementById('wrap').innerHTML = `
    <div class="aviso">
      ℹ️ "Venta 30d" y "cobertura" vienen del histórico real de ventas (hoy solo hay datos de prueba, no el día a día real). Cobertura = días que dura el stock actual al ritmo de venta de los últimos 30 días — se marca "Próximo a agotarse" cuando quedan 7 días o menos (el mismo tiempo de entrega usado en 1.5). "Rotación/mes" = cuántas veces se vendería el stock actual completo en un mes al ritmo de los últimos 30 días (venta 30d ÷ existencia). "Sugerido (37d)" es cuánto comprar HOY para que el stock alcance a durar 37 días — 30 días de stock objetivo + 7 días que se demora el proveedor en despachar — calculado como venta diaria promedio × 37 menos lo que ya hay; en 0 cuando ya hay más de lo necesario. El valor de inventario (costo, no precio de venta) se muestra combinado y por sede arriba, y por producto junto a la categoría. Cada producto tiene ahora una fila de inventario por sede: la cantidad, el estado y el mínimo/máximo se calculan sobre el <b>total combinado de ambas sedes</b> (igual que en 1.5), y abajo de cada producto se muestra el desglose real por sede. El mínimo/máximo mostrado es el calculado automáticamente en 1.5, salvo que ${puedeEditar ? 'lo ajustes manualmente con el botón "✏️ Ajustar" (se aplica al producto completo, en ambas sedes, para no dejar valores distintos entre sedes)' : 'alguien con Módulo 2 completo lo haya ajustado manualmente'}.
    </div>
    ${renderIndicadoresValor()}
    ${renderIndicadores(productos)}
    <div class="filtros">
      <select onchange="filtroSede=this.value; render()">
        <option value="todas" ${filtroSede === 'todas' ? 'selected' : ''}>Todas las sedes (total)</option>
        <option value="Chigorodó" ${filtroSede === 'Chigorodó' ? 'selected' : ''}>Solo Chigorodó</option>
        <option value="Belén de Bajirá" ${filtroSede === 'Belén de Bajirá' ? 'selected' : ''}>Solo Belén de Bajirá</option>
      </select>
      <select onchange="orden=this.value; render()">
        <option value="cobertura" ${orden === 'cobertura' ? 'selected' : ''}>Más urgente primero (menor cobertura)</option>
        <option value="rotacion" ${orden === 'rotacion' ? 'selected' : ''}>Mayor rotación primero (más venta)</option>
        <option value="sugerido" ${orden === 'sugerido' ? 'selected' : ''}>Mayor sugerido de compra primero</option>
      </select>
      <button class="filtro-chip ${filtroEstado === 'todos' ? 'act' : ''}" onclick="filtroEstado='todos'; render()">Todos</button>
      <button class="filtro-chip ${filtroEstado === 'sinstock' ? 'act' : ''}" onclick="filtroEstado='sinstock'; render()">Sin stock</button>
      <button class="filtro-chip ${filtroEstado === 'proximo' ? 'act' : ''}" onclick="filtroEstado='proximo'; render()">Próximos a agotarse</button>
      <button class="filtro-chip ${filtroEstado === 'sobre' ? 'act' : ''}" onclick="filtroEstado='sobre'; render()">Sobre stock</button>
      <button class="filtro-chip ${filtroNecesitaCompra ? 'act' : ''}" onclick="filtroNecesitaCompra=!filtroNecesitaCompra; render()">🛒 Necesita compra</button>
      <input type="text" placeholder="Buscar producto..." value="${filtroTexto}" oninput="filtroTexto=this.value; render()">
    </div>
    <div class="card">${filasHtml}</div>
  `;
}

async function guardarManual(codigoSap) {
  const idm = idSafe(codigoSap);
  const minVal = document.getElementById(`edit-min-${idm}`).value;
  const maxVal = document.getElementById(`edit-max-${idm}`).value;
  const nuevoMin = minVal === '' ? null : parseFloat(minVal);
  const nuevoMax = maxVal === '' ? null : parseFloat(maxVal);
  // Se actualiza por codigo_sap (no por id de fila), para que el ajuste manual quede
  // igual en las filas de las dos sedes de ese mismo producto y no se repita el mismo
  // problema que causó los precios duplicados en el Módulo 5.
  const { error } = await sb.from('inventario').update({
    stock_minimo_manual: nuevoMin,
    stock_maximo_manual: nuevoMax,
  }).eq('codigo_sap', codigoSap);
  if (error) {
    alert('No se pudo guardar: ' + error.message);
    return;
  }
  const p = productos.find(x => x.codigo_sap === codigoSap);
  if (p) {
    p.stock_minimo_manual = nuevoMin;
    p.stock_maximo_manual = nuevoMax;
    p.minimoEfectivo = nuevoMin !== null ? nuevoMin : p.stock_minimo_sugerido;
    p.maximoEfectivo = nuevoMax !== null ? nuevoMax : p.stock_maximo_sugerido;
  }
  editandoCodigo = null;
  render();
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const userId = session.user.id;
  const [{ data: perfil }, { data: permisos }] = await Promise.all([
    sb.from('perfiles').select('*').eq('id', userId).single(),
    sb.from('permisos_modulo').select('*').eq('perfil_id', userId),
  ]);

  if (!perfil) {
    document.getElementById('wrap').innerHTML = '<div class="loading">Tu usuario no tiene un perfil configurado todavía.</div>';
    return;
  }
  esSuperAdmin = perfil.es_super_admin;

  const nivel2 = (permisos || []).find(p => p.modulo === 2)?.nivel || 'inactivo';
  const puedeVer = esSuperAdmin || nivel2 !== 'inactivo';
  puedeEditar = esSuperAdmin || nivel2 === 'completo';

  if (!puedeVer) {
    document.getElementById('wrap').innerHTML = '<div class="loading">No tienes permiso para ver este módulo.</div>';
    return;
  }

  const [{ data: inv, error: errInv }, { data: stock }, { data: ventas }] = await Promise.all([
    sb.from('inventario').select('*').order('producto', { ascending: true }),
    sb.from('vista_stock_sugerido').select('*'),
    sb.from('resumen_ventas').select('*'),
  ]);

  if (errInv) {
    document.getElementById('wrap').innerHTML = '<div class="loading">No se pudo cargar el inventario: ' + errInv.message + '</div>';
    return;
  }

  const stockPorCodigo = {};
  (stock || []).forEach(s => { stockPorCodigo[s.codigo_sap] = s; });
  const ventasPorCodigo = {};
  (ventas || []).forEach(v => { ventasPorCodigo[v.codigo_sap] = v; });

  // Agrupa las filas de inventario (una por producto POR SEDE desde la Fase 25) por
  // codigo_sap, sumando la cantidad total y guardando el desglose real por sede — mismo
  // patrón ya usado en seguimiento-inventario.html (1.5, Fase 26).
  const porCodigo = {};
  (inv || []).forEach(row => {
    const key = row.codigo_sap;
    if (!porCodigo[key]) {
      porCodigo[key] = {
        codigo_sap: row.codigo_sap,
        producto: row.producto,
        categoria: row.categoria,
        unidad: row.unidad,
        actualizado_en: row.actualizado_en,
        cantidad: 0,
        valorTotal: 0,
        sedes: {},
        stock_minimo_manual: null,
        stock_maximo_manual: null,
      };
    }
    const acc = porCodigo[key];
    const cant = Number(row.cantidad) || 0;
    const valorFila = Number(row.valor_total) || 0;
    acc.cantidad += cant;
    acc.valorTotal += valorFila;
    acc.sedes[row.sede] = cant;
    // Si alguna de las filas por sede tiene un ajuste manual guardado, se usa ese valor
    // para el producto completo (guardarManual ahora escribe el mismo valor en ambas filas).
    if (row.stock_minimo_manual !== null && row.stock_minimo_manual !== undefined) acc.stock_minimo_manual = row.stock_minimo_manual;
    if (row.stock_maximo_manual !== null && row.stock_maximo_manual !== undefined) acc.stock_maximo_manual = row.stock_maximo_manual;
    if (!acc.actualizado_en || new Date(row.actualizado_en) > new Date(acc.actualizado_en)) acc.actualizado_en = row.actualizado_en;
  });

  // Fase 40 (20-sep): valor total del inventario (costo) pedido por Carlos —
  // combinado y por sede, sumado directamente sobre las filas reales de
  // `inventario` (una por producto × sede), no sobre el agrupado por producto.
  valorTotalGeneral = (inv || []).reduce((s, row) => s + (Number(row.valor_total) || 0), 0);
  valorPorSedeGeneral = {};
  SEDES.forEach(sede => {
    valorPorSedeGeneral[sede] = (inv || [])
      .filter(row => row.sede === sede)
      .reduce((s, row) => s + (Number(row.valor_total) || 0), 0);
  });

  productos = Object.values(porCodigo).map(p => {
    const s = stockPorCodigo[p.codigo_sap];
    const v = ventasPorCodigo[p.codigo_sap];
    const stock_minimo_sugerido = s ? s.stock_minimo_sugerido : null;
    const stock_maximo_sugerido = s ? s.stock_maximo_sugerido : null;
    const ventas30 = v ? Number(v.ventas_30d) : null;
    const cantidad = Number(p.cantidad) || 0;
    const ventaDiaria = (ventas30 !== null && ventas30 > 0) ? ventas30 / 30 : null;
    const coberturaDias = ventaDiaria !== null ? Math.round((cantidad / ventaDiaria) * 10) / 10 : null;
    // Rotación mensual: cuántas veces "rota" (se vende) el stock actual en
    // un mes, al ritmo de los últimos 30 días — solo tiene sentido si hay
    // algo de stock; si está en cero, la rotación no es calculable (no hay
    // sobre qué medir el giro, aunque sí haya venta reciente).
    const rotacionMensual = (ventas30 !== null && cantidad > 0) ? Math.round((ventas30 / cantidad) * 100) / 100 : null;
    // Sugerido de compra (Fase 40, 20-sep): cuánto pedir HOY para que el
    // stock alcance a durar DIAS_COBERTURA_OBJETIVO (37 = 30 de stock + 7
    // de despacho del proveedor), calculado con la venta diaria promedio de
    // los últimos 30 días. Sin datos de venta no hay forma confiable de
    // sugerir nada (queda en null, no en 0, para no dar a entender "no
    // necesita comprar" cuando en realidad es "no sabemos").
    const sugeridoCompra = ventaDiaria !== null ? Math.max(0, Math.ceil(ventaDiaria * DIAS_COBERTURA_OBJETIVO - cantidad)) : null;
    return {
      ...p,
      stock_minimo_sugerido,
      stock_maximo_sugerido,
      minimoEfectivo: (p.stock_minimo_manual !== null && p.stock_minimo_manual !== undefined) ? p.stock_minimo_manual : stock_minimo_sugerido,
      maximoEfectivo: (p.stock_maximo_manual !== null && p.stock_maximo_manual !== undefined) ? p.stock_maximo_manual : stock_maximo_sugerido,
      ventas30,
      coberturaDias,
      rotacionMensual,
      sugeridoCompra,
    };
  });

  render();
})();
</script>
