<script>
const SUPABASE_URL = 'https://fpqogvxssnoarzgxcitc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ccZF-8tenblFEah5lXfd3w_mYTHMtMC';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SEDES = ['Chigorodó', 'Belén de Bajirá'];

// Mismo criterio de categoría por prefijo de código SAP usado al cargar
// el primer listado real (Fase 17) — se usa como respaldo mientras SAP
// no entregue un campo real de "Grupo de artículos".
const MAPA_PREFIJO = {
  VET: 'Veterinaria', HRA: 'Herramientas y suministros agrícolas', HBD: 'Herbicidas',
  AGRO: 'Agroquímicos varios (mixto)', RPA: 'Repuestos de fumigadoras/equipos',
  ALM: 'Almacén general (mixto)', ITD: 'Insecticidas', FTF: 'Fertilizantes foliares',
  FGD: 'Fungicidas', FER: 'Fertilizantes edáficos/granulados', MCT: 'Mascotas',
  MYF: 'Fumigadoras y bombas', EPA: 'Elementos de protección personal',
  STIHL: 'Equipos y repuestos Stihl', PALIN: 'Herramientas y suministros agrícolas',
  EPP: 'Elementos de protección personal', NOLI: 'Línea Noli',
  POLEN: 'Insumos de polinización', SEM: 'Semillas', AGROLAB: 'Laboratorio / varios',
  CUCHILLO: 'Herramientas y suministros agrícolas', MEZCLA: 'Fertilizantes edáficos/granulados',
  ACE: 'Herbicidas', CASCARILLA: 'Insumos orgánicos', FUN: 'Herramientas y suministros agrícolas',
  HER: 'Herramientas y suministros agrícolas', MP: 'Insumos de polinización',
  PIEDRA: 'Herramientas y suministros agrícolas', POLINIZA: 'Insumos de polinización',
  STHIL: 'Equipos y repuestos Stihl', TALCO: 'Insumos varios',
};
function prefijoDe(codigo) {
  const m = String(codigo || '').match(/^([A-Za-z]+)/);
  return m ? m[1].toUpperCase() : null;
}

// Igual que en el cargador de ventas: un código puede excluirse por
// coincidencia EXACTA (ej. "SER_04", un sub-código puntual dentro de
// un grupo que en general SÍ se debe cargar) o por prefijo de letras
// (ej. "TUZAP" — un grupo completo). Sin esto, escribir "SER_04" en
// "agregar exclusión manual" no tendría ningún efecto, porque su
// prefijo de letras ("SER") también cubre otros códigos que no se
// quieren excluir (SER_01, SER_05, SER_10, SER_12...).
function estaExcluido(codigo, excluidosSet) {
  const c = String(codigo || '').trim().toUpperCase();
  if (!c) return false;
  if (excluidosSet.has(c)) return true;
  const p = prefijoDe(c);
  return !!p && excluidosSet.has(p);
}
function categoriaPorPrefijo(codigo) {
  const p = prefijoDe(codigo);
  return p ? (MAPA_PREFIJO[p] || null) : null;
}

// Alias de encabezados posibles — para que el mismo cargador sirva tanto
// con el reporte de saldo que ya conocemos, como con un export más
// completo el día que SAP entregue grupo/proveedor/unidad/almacén reales.
// El orden de cada lista importa: se busca la variante MÁS ESPECÍFICA
// primero (ej. "cantidad acumulada", el saldo real) antes que la más
// genérica (ej. "cantidad", que en el reporte de movimientos de SAP
// suele venir vacía) — si se buscara sin respetar este orden, se podría
// tomar por error la columna equivocada cuando el archivo trae varias
// columnas parecidas.
const ALIAS = {
  codigo_sap: ['numero de articulo', 'número de artículo', 'codigo sap', 'código sap', 'codigo', 'código', 'item code'],
  // "descripcion del articulo" es el encabezado real del formato de la Fase
  // 24 (el mismo export que trae la columna de almacén) — sin este alias
  // exacto, ese archivo no reconocía ni código ni producto y la detección
  // de sede por almacén nunca llegaba a evaluarse (hallazgo Fase 40).
  producto: ['descripcion del articulo', 'descripción del artículo', 'descripcion', 'descripción', 'nombre', 'producto', 'item name'],
  categoria: ['nombre de grupo', 'grupo de articulos', 'grupo de artículos', 'grupo', 'categoria', 'categoría', 'item group'],
  proveedor: ['proveedor', 'vendor'],
  unidad: ['unidad de medida', 'unidad', 'um', 'unit'],
  cantidad: ['cantidad acumulada', 'existencia', 'en stock', 'stock', 'in stock', 'cantidad'],
  costo_unit: ['costo unitario', 'precio promedio', 'costo', 'precio'],
  valor_total: ['valor acumulado', 'valor total', 'valor'],
  // Fase 24: reporte de SAP con desglose por almacén — "Nombre de almacén"
  // es lo único que sirve para deducir la sede (el código de almacén no
  // se conoce), por eso es el único alias real aquí.
  almacen: ['nombre de almacen', 'nombre de almacén'],
};
function normaliza(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}
function mapaColumnas(headers) {
  const norm = headers.map(normaliza);
  const mapa = {};
  Object.entries(ALIAS).forEach(([campo, alias]) => {
    // Recorre la lista de alias EN ORDEN DE PRIORIDAD (no en el orden en
    // que aparecen las columnas del archivo), para que la variante más
    // específica gane si el archivo trae varias columnas parecidas.
    for (const a of alias) {
      const idx = norm.indexOf(normaliza(a));
      if (idx !== -1) { mapa[campo] = headers[idx]; break; }
    }
  });
  return mapa;
}

// Fase 40 (20-sep): el inventario real es por sede, y el reporte que Carlos
// puede sacar de SAP no siempre trae una columna de almacén (eso solo pasa
// con el formato completo de la Fase 24). Carlos propuso dos formas de
// indicar la sede al cargar: (a) un archivo separado por sede, o (b) un
// mismo archivo con una hoja por sede. Se soportan las dos, más la
// columna de almacén cuando está disponible, con esta prioridad por fila:
//   1. Columna de almacén reconocida en el archivo (mapea a la sede real,
//      o descarta la fila si es de otro almacén — regla de la Fase 24).
//   2. Nombre de la hoja de Excel, si CADA hoja con datos del archivo
//      coincide con el nombre de una sede real.
//   3. La sede de la casilla en la que se subió el archivo (para el caso
//      más simple: un archivo por sede, sin ninguna de las dos señales
//      anteriores).
function detectarSedeDeHoja(nombreHoja) {
  const n = normaliza(nombreHoja);
  if (n.includes('chigorod')) return 'Chigorodó';
  if (n.includes('bajira')) return 'Belén de Bajirá';
  return null;
}
function sedeDeAlmacen(nombreAlmacen) {
  const n = normaliza(nombreAlmacen);
  if (n.includes('chigorod')) return 'Chigorodó';
  if (n.includes('bajira')) return 'Belén de Bajirá';
  return null; // otro almacén (planta, viveros, semillas...) — se excluye
}

async function procesarArchivo(file, sedeDefault) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });

  // Lee todas las hojas con filas (soporta el mismo archivo con una hoja
  // por sede, o un archivo con hojas auxiliares vacías que se ignoran).
  const hojasConDatos = [];
  const jsonPorHoja = {};
  wb.SheetNames.forEach(nombreHoja => {
    const json = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { defval: null });
    if (json.length) { hojasConDatos.push(nombreHoja); jsonPorHoja[nombreHoja] = json; }
  });

  const sedesPorHoja = {};
  hojasConDatos.forEach(n => { sedesPorHoja[n] = detectarSedeDeHoja(n); });
  const modoHojasPorSede = hojasConDatos.length > 1 && hojasConDatos.every(n => sedesPorHoja[n] !== null);

  const filasArchivo = [];
  let descartadosOtroAlmacen = 0;
  let tieneColumnaAlmacen = false;

  for (const nombreHoja of hojasConDatos) {
    const json = jsonPorHoja[nombreHoja];
    const headers = Object.keys(json[0]);
    const mapa = mapaColumnas(headers);
    if (!mapa.codigo_sap || !mapa.producto) continue; // se valida a nivel de archivo completo más abajo
    if (mapa.almacen) tieneColumnaAlmacen = true;

    const sedeDeHoja = modoHojasPorSede ? sedesPorHoja[nombreHoja] : null;

    json.forEach(row => {
      const codigo_sap = String(row[mapa.codigo_sap] || '').trim();
      const producto = String(row[mapa.producto] || '').trim();
      if (!codigo_sap || !producto) return;
      const cantidad = mapa.cantidad ? Number(row[mapa.cantidad]) || 0 : 0;
      const valorReportado = mapa.valor_total ? Number(row[mapa.valor_total]) || null : null;
      let costo_unit = mapa.costo_unit ? Number(row[mapa.costo_unit]) || null : null;
      if (costo_unit === null && valorReportado !== null && cantidad) {
        costo_unit = Math.round((valorReportado / cantidad) * 10000) / 10000;
      }
      const categoria = mapa.categoria ? String(row[mapa.categoria] || '').trim() || null : categoriaPorPrefijo(codigo_sap);
      const proveedor = mapa.proveedor ? String(row[mapa.proveedor] || '').trim() || null : null;
      const unidad = mapa.unidad ? String(row[mapa.unidad] || '').trim() || null : null;

      let sede;
      if (mapa.almacen) {
        const sedeAlmacen = sedeDeAlmacen(row[mapa.almacen]);
        if (!sedeAlmacen) { descartadosOtroAlmacen++; return; }
        sede = sedeAlmacen;
      } else if (sedeDeHoja) {
        sede = sedeDeHoja;
      } else {
        sede = sedeDefault;
      }

      const valor_total = costo_unit !== null ? Math.round(cantidad * costo_unit) : valorReportado;
      filasArchivo.push({ codigo_sap, producto, categoria, proveedor, unidad, cantidad, costo_unit, valor_total, sede });
    });
  }

  return { filas: filasArchivo, descartadosOtroAlmacen, tieneColumnaAlmacen, modoHojasPorSede };
}

// Suma cantidad (y promedia el costo unitario ponderado por cantidad) de
// filas que comparten el mismo código de artículo Y la misma sede —
// mismo criterio ya usado para el mismo problema en `cargar-ventas.html`
// (Fase 37): si el mismo producto aparece dos veces (dos hojas, o el
// mismo archivo subido sin querer en las dos casillas), sumarlas es más
// seguro que sobrescribir en silencio y perder existencia real.
function colapsarDuplicados(lista) {
  const colapsadas = new Map();
  let duplicados = 0;
  for (const f of lista) {
    const clave = f.codigo_sap + '||' + f.sede;
    const valorFila = f.costo_unit !== null && f.costo_unit !== undefined
      ? f.costo_unit * (Number(f.cantidad) || 0)
      : (f.valor_total !== null ? Number(f.valor_total) : 0);
    const existente = colapsadas.get(clave);
    if (existente) {
      existente.cantidad = (Number(existente.cantidad) || 0) + (Number(f.cantidad) || 0);
      existente._valorAcumulado = (existente._valorAcumulado || 0) + valorFila;
      duplicados++;
    } else {
      colapsadas.set(clave, { ...f, _valorAcumulado: valorFila });
    }
  }
  const filas = [...colapsadas.values()].map(f => {
    const cantidad = Number(f.cantidad) || 0;
    const costo_unit = cantidad ? Math.round((f._valorAcumulado / cantidad) * 10000) / 10000 : (f.costo_unit ?? null);
    const valor_total = costo_unit !== null ? Math.round(cantidad * costo_unit) : f.valor_total;
    const { _valorAcumulado, ...resto } = f;
    return { ...resto, costo_unit, valor_total };
  });
  return { filas, duplicados };
}

let archivosPorSede = { 'Chigorodó': null, 'Belén de Bajirá': null }; // { nombreArchivo, filas, descartadosOtroAlmacen, modoHojasPorSede } por sede
let excluidos = new Map();   // prefijo (mayúsculas) -> fila de sap_prefijos_excluidos
let checkboxExcluir = new Set(); // prefijos marcados como "excluir" en la vista previa actual
let esSuperAdmin = false;
let puedeAdministrarExcluidos = false;
let sesionActual = null;
let mensajeResultado = '';
let filasParaEnviar = []; // calculado en cada render(), usado tal cual por el botón "Confirmar"

function filasCombinadas() {
  return SEDES.flatMap(s => archivosPorSede[s]?.filas || []);
}

function resumenPorPrefijo(lista) {
  const m = {};
  lista.forEach(f => {
    const p = prefijoDe(f.codigo_sap) || '(sin prefijo)';
    if (!m[p]) m[p] = { count: 0, ejemplo: f.producto, categoria: f.categoria };
    m[p].count++;
  });
  return m;
}

function render() {
  const combinadas = filasCombinadas();
  const resumen = resumenPorPrefijo(combinadas);
  const prefijosOrdenados = Object.keys(resumen).sort((a, b) => resumen[b].count - resumen[a].count);
  const sinExcluir = combinadas.filter(f => !estaExcluido(f.codigo_sap, checkboxExcluir));
  const { filas: filasIncluidas, duplicados } = colapsarDuplicados(sinExcluir);
  filasParaEnviar = filasIncluidas;
  const preview = filasIncluidas.slice(0, 5);
  const cols = preview.length ? ['codigo_sap', 'producto', 'categoria', 'sede', 'cantidad', 'costo_unit', 'proveedor', 'unidad'].filter(c => c in preview[0]) : [];

  const descartadosAlmacen = SEDES.reduce((s, sede) => s + (archivosPorSede[sede]?.descartadosOtroAlmacen || 0), 0);

  document.getElementById('wrap').innerHTML = `
    <div class="aviso">
      ℹ️ Esta pantalla reemplaza el inventario de cada sede con lo que traiga su archivo: actualiza los artículos que ya existen en esa sede (sin tocar los ajustes manuales de mínimo/máximo), agrega los nuevos, y elimina los que ya no aparezcan — pero <b>solo para la o las sedes que efectivamente subas esta vez</b>. Si hoy solo subes el archivo de una sede, la otra queda exactamente como estaba.
    </div>
    <div class="card">
      <h3>1. Selecciona los archivos por sede</h3>
      <div style="font-size:12px;color:#777;margin-bottom:10px">
        Cada sede tiene su propio inventario. Puedes subir el archivo de cada una en su casilla (si hoy solo tienes lista una sede, sube solo esa — la otra no se toca). Si un mismo archivo ya trae las dos sedes, súbelo en cualquiera de las dos casillas: si trae una columna de "Nombre de almacén" (como el reporte completo de SAP), o si tiene una hoja llamada "Chigorodó" y otra "Belén de Bajirá" (o similar), el sistema reconoce la sede real de cada fila automáticamente.
      </div>
      <div class="slots">
        ${SEDES.map(sede => `
          <div class="slot">
            <div class="drop">
              📄 <b>${sede}</b>
              ${archivosPorSede[sede] ? `
                <div class="cargado">${archivosPorSede[sede].nombreArchivo}<br>${archivosPorSede[sede].filas.length} filas detectadas${archivosPorSede[sede].modoHojasPorSede ? ' (hojas por sede)' : ''}${archivosPorSede[sede].tieneColumnaAlmacen ? ' (columna de almacén)' : ''}</div>
                <button class="btn-x" data-quitar-slot="${sede}">🗑 Quitar</button>
              ` : `<br><input type="file" class="f-archivo-slot" data-sede="${sede}" accept=".xlsx,.xls">`}
            </div>
          </div>
        `).join('')}
      </div>
      ${descartadosAlmacen ? `<div style="font-size:11.5px;color:#999;margin-top:10px">ℹ️ ${descartadosAlmacen} filas se descartaron por pertenecer a un almacén que no es Chigorodó ni Belén de Bajirá (planta, viveros, semillas, etc.).</div>` : ''}
      ${mensajeResultado}
    </div>
    ${combinadas.length ? `
    <div class="card">
      <h3>2. Grupos detectados en los archivos (${combinadas.length} filas)</h3>
      <div style="font-size:12px;color:#777;margin-bottom:6px">Marca los que NO son de Agrotienda (ej. de otro negocio que comparte el mismo SAP) — quedan excluidos de esta carga y de las siguientes, no hay que repetirlo cada día.</div>
      ${prefijosOrdenados.map(p => `
        <div class="grp-row">
          <input type="checkbox" data-prefijo="${p}" ${checkboxExcluir.has(p) ? 'checked' : ''} ${puedeAdministrarExcluidos ? '' : 'disabled'}>
          <span class="grp-cod">${p}</span>
          <span class="grp-nom">${resumen[p].categoria || '(sin categoría)'} — ej. "${resumen[p].ejemplo}"</span>
          <span class="grp-cnt">${resumen[p].count} art.</span>
          ${checkboxExcluir.has(p) ? '<span class="tag-excl">Excluido</span>' : ''}
        </div>
      `).join('')}
      ${!puedeAdministrarExcluidos ? '<div style="font-size:11px;color:#999;margin-top:8px">Solo Carlos, Diego o Alejandra pueden cambiar qué grupos se excluyen.</div>' : ''}
    </div>
    <div class="card">
      <h3>3. Vista previa de lo que se va a cargar (${filasIncluidas.length} artículos × sede)</h3>
      ${duplicados ? `<div class="msg aviso-dup">⚠️ ${duplicados} productos aparecieron repetidos (mismo código y misma sede) dentro de los archivos cargados — se sumó su cantidad automáticamente. Si esto no es lo que esperabas (por ejemplo, subiste el mismo archivo en las dos casillas por error), usa "🗑 Quitar" arriba y vuelve a intentar.</div>` : ''}
      <table>
        <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>
          ${preview.map(f => `<tr>${cols.map(c => `<td>${f[c] ?? '—'}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
      <button class="btn" id="btn-confirmar" style="margin-top:14px" ${filasIncluidas.length ? '' : 'disabled'}>✅ Confirmar y cargar ${filasIncluidas.length} artículos × sede</button>
      <button class="btn btn-sec" id="btn-cancelar" style="margin-top:14px">Cancelar</button>
    </div>` : ''}
    <div class="card">
      <h3>Grupos excluidos (no se cargan nunca, aunque aparezcan en el archivo)</h3>
      <div id="lista-excluidos">Cargando...</div>
      ${puedeAdministrarExcluidos ? `
      <div class="mini-form">
        <input type="text" id="nuevo-prefijo" placeholder="Código, ej. NOLI" style="width:110px">
        <input type="text" id="nuevo-motivo" placeholder="Motivo (opcional)" style="flex:1;min-width:160px">
        <button class="btn btn-sec" id="btn-agregar-excluido">+ Agregar</button>
      </div>` : ''}
    </div>
    <div class="card">
      <h3>Historial de cargas</h3>
      <div id="historial">Cargando historial...</div>
    </div>
  `;
  bind();
  renderExcluidos();
  cargarHistorial();
}

function renderExcluidos() {
  const el = document.getElementById('lista-excluidos');
  if (!el) return;
  const lista = [...excluidos.values()];
  if (!lista.length) { el.innerHTML = '<div style="color:#999;font-size:12px">Ningún grupo excluido todavía.</div>'; return; }
  el.innerHTML = lista.map(x => `
    <div class="grp-row">
      <span class="grp-cod">${x.prefijo}</span>
      <span class="grp-nom">${x.motivo || '—'}</span>
      ${puedeAdministrarExcluidos ? `<button class="btn-x" data-quitar="${x.prefijo}" title="Quitar de excluidos">🗑</button>` : ''}
    </div>
  `).join('');
  if (puedeAdministrarExcluidos) {
    el.querySelectorAll('[data-quitar]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await sb.from('sap_prefijos_excluidos').delete().eq('prefijo', btn.dataset.quitar);
        await cargarExcluidos();
        render();
      });
    });
  }
}

async function cargarExcluidos() {
  const { data } = await sb.from('sap_prefijos_excluidos').select('*').order('prefijo');
  excluidos = new Map((data || []).map(x => [x.prefijo.toUpperCase(), x]));
  checkboxExcluir = new Set(excluidos.keys());
}

async function manejarArchivoSlot(sede, file) {
  if (!file) return;
  mensajeResultado = '';
  try {
    const resultado = await procesarArchivo(file, sede);
    if (!resultado.filas.length) {
      alert(`No se encontraron filas válidas (con código y descripción) en el archivo de ${sede}.`);
      return;
    }
    archivosPorSede[sede] = { nombreArchivo: file.name, ...resultado };
    // Al detectar un archivo nuevo, se parte de los grupos ya excluidos en la
    // base — si trae un grupo nuevo que no está en esa lista, aparece sin
    // marcar (incluido) hasta que alguien lo excluya.
    checkboxExcluir = new Set(excluidos.keys());
    render();
  } catch (e) {
    alert('No se pudo leer el archivo: ' + e.message);
  }
}

function bind() {
  document.querySelectorAll('.f-archivo-slot').forEach(inp => {
    inp.addEventListener('change', (e) => {
      const sede = inp.dataset.sede;
      const file = e.target.files[0];
      manejarArchivoSlot(sede, file);
    });
  });

  document.querySelectorAll('[data-quitar-slot]').forEach(btn => {
    btn.addEventListener('click', () => {
      archivosPorSede[btn.dataset.quitarSlot] = null;
      mensajeResultado = '';
      render();
    });
  });

  // Marcar/desmarcar un grupo aquí lo excluye (o lo vuelve a incluir) de
  // forma permanente, no solo para esta carga — se guarda de una vez en
  // `sap_prefijos_excluidos`, para que Diego no tenga que repetir la
  // marca cada día.
  document.querySelectorAll('[data-prefijo]').forEach(chk => {
    chk.addEventListener('change', async () => {
      const p = chk.dataset.prefijo;
      chk.disabled = true;
      if (chk.checked) {
        checkboxExcluir.add(p);
        await sb.from('sap_prefijos_excluidos').upsert({ prefijo: p, motivo: 'Excluido desde la carga', creado_por: sesionActual.user.id });
      } else {
        checkboxExcluir.delete(p);
        await sb.from('sap_prefijos_excluidos').delete().eq('prefijo', p);
      }
      await cargarExcluidos(); // deja checkboxExcluir sincronizado con lo que quedó guardado
      render();
    });
  });

  document.getElementById('btn-agregar-excluido')?.addEventListener('click', async () => {
    const prefijo = (document.getElementById('nuevo-prefijo')?.value || '').trim().toUpperCase();
    const motivo = (document.getElementById('nuevo-motivo')?.value || '').trim() || null;
    if (!prefijo) { alert('Escribe el código del grupo a excluir.'); return; }
    const { error } = await sb.from('sap_prefijos_excluidos').upsert({ prefijo, motivo, creado_por: sesionActual.user.id });
    if (error) { alert('No se pudo agregar: ' + error.message); return; }
    await cargarExcluidos();
    render();
  });

  document.getElementById('btn-cancelar')?.addEventListener('click', () => {
    archivosPorSede = { 'Chigorodó': null, 'Belén de Bajirá': null };
    mensajeResultado = '';
    render();
  });

  document.getElementById('btn-confirmar')?.addEventListener('click', async () => {
    const btn = document.getElementById('btn-confirmar');
    btn.disabled = true;
    btn.textContent = 'Cargando...';
    const totalArchivo = filasCombinadas().length;
    const omitidos = totalArchivo - filasParaEnviar.length; // excluidos por grupo o colapsados como duplicados
    try {
      const resp = await fetch('/api/cargar-inventario', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${sesionActual.access_token}`,
        },
        body: JSON.stringify({ articulos: filasParaEnviar }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        mensajeResultado = `<div class="msg err">❌ ${data.error || 'No se pudo cargar'}</div>`;
      } else {
        mensajeResultado = `
          <div class="resumen">
            <span class="chip-r nuevo">${data.nuevos} nuevos</span>
            <span class="chip-r">${data.actualizados} actualizados</span>
            <span class="chip-r elim">${data.eliminados} eliminados</span>
          </div>
          <div class="msg ok">✅ Inventario de ${(data.sedes || []).join(' y ')} actualizado correctamente (${data.total} artículo × sede procesados)${omitidos ? `, ${omitidos} filas omitidas (grupo excluido o duplicado ya sumado)` : ''}.</div>
        `;
        archivosPorSede = { 'Chigorodó': null, 'Belén de Bajirá': null };
      }
    } catch (e) {
      mensajeResultado = `<div class="msg err">❌ Error de red: ${e.message}</div>`;
    }
    render();
    cargarHistorial();
  });
}

function fmtFechaHora(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('es-CO', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function cargarHistorial() {
  const el = document.getElementById('historial');
  if (!el) return;
  const { data, error } = await sb.from('sync_log').select('*').eq('modulo', 'inventario').order('fecha', { ascending: false }).limit(10);
  if (error) { el.innerHTML = `<div style="color:#999;font-size:12px">No se pudo cargar el historial.</div>`; return; }
  if (!data || !data.length) { el.innerHTML = `<div style="color:#999;font-size:12px">Todavía no hay cargas registradas.</div>`; return; }
  el.innerHTML = data.map(l => `
    <div class="hist-row">
      <span>${fmtFechaHora(l.fecha)}</span>
      <span style="flex:1;padding:0 10px">${l.mensaje || '—'}</span>
      <span class="hist-estado ${l.status === 'ok' ? 'hist-ok' : 'hist-error'}">${l.status}</span>
    </div>
  `).join('');
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  sesionActual = session;

  const [{ data: perfil }, { data: permisos }] = await Promise.all([
    sb.from('perfiles').select('*').eq('id', session.user.id).single(),
    sb.from('permisos_modulo').select('*').eq('perfil_id', session.user.id),
  ]);
  if (!perfil) {
    document.getElementById('wrap').innerHTML = '<div class="loading">Tu usuario no tiene un perfil configurado todavía.</div>';
    return;
  }

  esSuperAdmin = perfil.es_super_admin;
  const cargo = (perfil.cargo || '').toLowerCase();
  const autorizado = esSuperAdmin || cargo.includes('almacén') || cargo.includes('almacen');

  if (!autorizado) {
    document.getElementById('wrap').innerHTML = '<div class="loading">No tienes permiso para usar esta pantalla — está reservada para quien carga el inventario.</div>';
    return;
  }

  const nivel2 = (permisos || []).find(p => p.modulo === 2)?.nivel || 'inactivo';
  puedeAdministrarExcluidos = esSuperAdmin || nivel2 === 'completo';

  await cargarExcluidos();
  render();
})();
</script>

</body>
</html>
