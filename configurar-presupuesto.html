<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrotienda Bioplanta · Configurar presupuesto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v1:#33513a;--v2:#4f7c5a;--v3:#84a38c;--v4:#a9c2af;--vbg:#eaefeb;--vlt:#f4f8f5;--texto:#1a2e1a;--beige:#e6ceab;--vino:#984745}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f0;color:var(--texto);min-height:100vh}
.header{background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo-ico{font-size:26px}
.brand{font-size:15px;font-weight:800}
.brand-sub{font-size:11px;opacity:.8}
.btn-h{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none}

.wrap{max-width:600px;margin:0 auto;padding:18px 18px 60px}
.loading{text-align:center;padding:80px;color:#888}
.aviso{background:var(--beige);color:var(--v1);border-radius:10px;padding:12px 16px;font-size:12.5px;margin-bottom:16px;line-height:1.5}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:18px}
.card h3{font-size:14px;color:var(--v1);margin-bottom:10px}

label{display:block;font-size:11.5px;color:#777;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;margin-top:16px}
label:first-child{margin-top:0}
input{width:100%;border:1.5px solid #d6e2d9;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
.campo-monto{position:relative}
.campo-monto span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#999;font-weight:700}
.campo-monto input{padding-left:24px}

.btn{background:var(--v2);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:18px;width:100%}
.btn:disabled{opacity:.5;cursor:default}

.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px}
.msg.ok{background:#e6f4ea;color:#256d3b}
.msg.err{background:#fde3e2;color:var(--vino)}

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{--vlt:#faf8f4;--gris:#f6f4f0;--texto:#25281f;--beige-lt:#f6ecdd;--vino-lt:#f3e8e7}
html,body{font-family:'Plus Jakarta Sans',Inter,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--vlt)}
button,input,select,textarea{font-family:inherit}
h1,h2,h3{font-weight:800;letter-spacing:-.015em;line-height:1.2;color:var(--v1)}
.card{border-radius:14px;border:1px solid #e6e1d6;box-shadow:0 2px 10px rgba(37,40,31,.06)}
button,.btn,input{border-radius:10px}
.btn{font-weight:600;letter-spacing:.01em;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(37,40,31,.16);filter:brightness(1.05)}

@media (max-width:640px){
  .wrap{padding:14px 12px 48px}
  .header{padding:13px 14px}
  .brand{font-size:14px}
  .card{padding:16px 14px}
}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-l">
    <div class="logo-ico">🎯</div>
    <div>
      <div class="brand">Configurar presupuesto</div>
      <div class="brand-sub">Meta de venta y punto de equilibrio por sede — solo Gerencia</div>
    </div>
  </div>
  <a class="btn-h" href="gerencia-ventas.html">← Ventas por almacén</a>
</div>

<div class="wrap" id="wrap">
  <div class="loading">Cargando...</div>
</div>

<script>
const SUPABASE_URL = 'https://fpqogvxssnoarzgxcitc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ccZF-8tenblFEah5lXfd3w_mYTHMtMC';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SEDES = ['Chigorodó', 'Belén de Bajirá'];

let mesElegido = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;
function valoresVacios() {
  const v = {};
  SEDES.forEach(s => v[s] = { monto: '', punto_equilibrio: '' });
  return v;
}
let valores = valoresVacios();
let cargando = false;
let mensaje = null; // { tipo: 'ok'|'err', texto }

function fmtMiles(n) {
  const limpio = String(n || '').replace(/[^0-9]/g, '');
  return limpio ? Number(limpio).toLocaleString('es-CO') : '';
}

async function cargarMes() {
  mensaje = null;
  const [anio, mes] = mesElegido.split('-').map(Number);
  const { data } = await sb.from('presupuesto_venta').select('*').eq('anio', anio).eq('mes', mes);
  valores = valoresVacios();
  (data || []).forEach(r => {
    if (!SEDES.includes(r.sede)) return;
    valores[r.sede].monto = String(Math.round(Number(r.monto) || 0));
    valores[r.sede].punto_equilibrio = r.punto_equilibrio ? String(Math.round(Number(r.punto_equilibrio))) : '';
  });
  render();
}

async function guardar() {
  const [anio, mes] = mesElegido.split('-').map(Number);
  const metas = SEDES.map(sede => ({
    sede,
    monto: Number(String(valores[sede].monto).replace(/[^0-9]/g, '')) || 0,
    punto_equilibrio: Number(String(valores[sede].punto_equilibrio).replace(/[^0-9]/g, '')) || 0,
  }));
  if (metas.every(m => m.monto === 0)) {
    mensaje = { tipo: 'err', texto: 'Escribe al menos un monto mayor a cero.' };
    render();
    return;
  }
  cargando = true;
  mensaje = null;
  render();
  try {
    const { data: { session } } = await sb.auth.getSession();
    const resp = await fetch('/api/guardar-presupuesto', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ anio, mes, metas }),
    });
    const json = await resp.json();
    if (!resp.ok) throw new Error(json.error || 'Error al guardar');
    mensaje = { tipo: 'ok', texto: `Presupuesto de ${mesElegido} guardado correctamente.` };
  } catch (e) {
    mensaje = { tipo: 'err', texto: e.message };
  }
  cargando = false;
  render();
}

function render() {
  document.getElementById('wrap').innerHTML = `
    <div class="aviso">
      ℹ️ Aquí conviven dos metas distintas por sede, cada una con su propio uso:<br>
      <b>Meta de venta total</b>: en 1.3 (Resumen de venta) se suma entre las dos sedes y se compara contra el total vendido de toda la agrotienda (contado + crédito). En 3.1 (cumplimiento de presupuesto por sede) esa misma meta se compara solo contra las ventas de contado de esa sede — el crédito no cuenta para el cumplimiento individual de una sede.<br>
      <b>Punto de equilibrio</b> (solo ventas de contado — el crédito ya es utilidad de los dueños): se usa en 3.1 para el seguimiento semana a semana de cada sede. Es opcional; si lo dejas vacío, 3.1 simplemente no muestra esa comparación para el mes.<br>
      Ninguna de las dos reemplaza ni edita ventas reales — solo definen el objetivo del mes.
    </div>

    <div class="card">
      <h3>📅 Mes a configurar</h3>
      <label for="f-mes">Mes</label>
      <input type="month" id="f-mes" value="${mesElegido}">

      ${SEDES.map(sede => `
        <label for="f-${sede}-monto">Meta de venta total ${sede}</label>
        <div class="campo-monto">
          <span>$</span>
          <input type="text" inputmode="numeric" id="f-${sede}-monto" value="${fmtMiles(valores[sede].monto)}" placeholder="0">
        </div>

        <label for="f-${sede}-pe">Punto de equilibrio ${sede} (solo contado)</label>
        <div class="campo-monto">
          <span>$</span>
          <input type="text" inputmode="numeric" id="f-${sede}-pe" value="${fmtMiles(valores[sede].punto_equilibrio)}" placeholder="0">
        </div>
      `).join('')}

      <button class="btn" id="btn-guardar" ${cargando ? 'disabled' : ''}>${cargando ? 'Guardando...' : 'Guardar presupuesto'}</button>
      ${mensaje ? `<div class="msg ${mensaje.tipo}">${mensaje.texto}</div>` : ''}
    </div>
  `;

  document.getElementById('f-mes').addEventListener('change', (e) => { mesElegido = e.target.value; cargarMes(); });
  SEDES.forEach(sede => {
    document.getElementById(`f-${sede}-monto`).addEventListener('input', (e) => {
      valores[sede].monto = e.target.value.replace(/[^0-9]/g, '');
      e.target.value = fmtMiles(valores[sede].monto);
    });
    document.getElementById(`f-${sede}-pe`).addEventListener('input', (e) => {
      valores[sede].punto_equilibrio = e.target.value.replace(/[^0-9]/g, '');
      e.target.value = fmtMiles(valores[sede].punto_equilibrio);
    });
  });
  document.getElementById('btn-guardar').addEventListener('click', guardar);
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  const userId = session.user.id;
  const { data: perfil } = await sb.from('perfiles').select('*').eq('id', userId).single();
  if (!perfil) {
    document.getElementById('wrap').innerHTML = '<div class="loading">Tu usuario no tiene un perfil configurado todavía.</div>';
    return;
  }
  if (!perfil.es_super_admin) {
    document.getElementById('wrap').innerHTML = '<div class="loading">No tienes permiso para ver este módulo.</div>';
    return;
  }

  await cargarMes();
})();
</script>

</body>
</html>
