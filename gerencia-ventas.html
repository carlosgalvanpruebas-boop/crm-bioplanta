<html lang="es">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v1:#33513a;--v2:#4f7c5a;--v3:#84a38c;--v4:#a9c2af;--vbg:#eaefeb;--vlt:#f4f8f5;--texto:#1a2e1a;--beige:#e6ceab;--vino:#984745}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f0;color:var(--texto);min-height:100vh}
.header{background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo-ico{font-size:26px}
.brand{font-size:15px;font-weight:800}
.brand-sub{font-size:11px;opacity:.8}
.hdr-r{display:flex;gap:8px;flex-wrap:wrap}
.btn-h{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none}

.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 60px}
.loading{text-align:center;padding:80px;color:#888}
.aviso{background:var(--beige);color:var(--v1);border-radius:10px;padding:12px 16px;font-size:12.5px;margin-bottom:16px;line-height:1.5}

.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filtro-chip{background:#fff;border:1.5px solid var(--v3);color:var(--v2);padding:6px 13px;border-radius:16px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.filtro-chip.act{background:var(--v2);color:#fff;border-color:var(--v2)}
.filtro-grupo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.filtro-label{font-size:11px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.3px;width:100%;margin-top:6px}
.rango-custom{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.rango-custom input{border:1.5px solid #d6e2d9;border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit}
.rango-custom span{font-size:12px;color:#888}

.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:18px}
.card h3{font-size:13.5px;color:var(--v1);margin-bottom:4px}
.card .sub{font-size:11.5px;color:#888;margin-bottom:14px}

.sedes-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sede-card{background:var(--vlt);border-radius:14px;padding:16px}
.sede-card .sede-nom{font-size:13px;font-weight:800;color:var(--v1);margin-bottom:10px}
.sede-card .sede-total{font-size:24px;font-weight:800;color:var(--v1);margin-bottom:2px}
.sede-card .sede-sub{font-size:11px;color:#888;margin-bottom:12px}
.sede-mini{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid var(--vbg)}
.sede-mini b{color:var(--v2)}
.sede-mini.credito b{color:var(--vino)}

.presu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.presu-item .presu-nom{font-size:12.5px;font-weight:700;color:var(--v1);margin-bottom:6px}
.presu-barra{background:var(--vbg);border-radius:10px;height:14px;overflow:hidden;margin:8px 0}
.presu-fill{background:var(--v2);height:100%;border-radius:10px 0 0 10px;transition:width .3s}
.presu-fill.superado{background:var(--v1)}
.presu-datos{display:flex;justify-content:space-between;font-size:11.5px;color:#666;flex-wrap:wrap;gap:4px}
.presu-pct{font-size:22px;font-weight:800;color:var(--v1)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--vbg)}
th{color:var(--v2);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;background:var(--vlt)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;white-space:nowrap}
td.mes-actual{font-weight:800;color:var(--v1)}
tfoot td{border-top:2px solid var(--v3);border-bottom:none;background:var(--vlt);font-weight:800;color:var(--v1)}

.vacio{text-align:center;padding:40px;color:#999;font-size:13px}

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{--vlt:#faf8f4;--gris:#f6f4f0;--texto:#25281f;--beige-lt:#f6ecdd;--vino-lt:#f3e8e7}
html,body{font-family:'Plus Jakarta Sans',Inter,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--vlt)}
button,input,select,textarea{font-family:inherit}
h1,h2,h3{font-weight:800;letter-spacing:-.015em;line-height:1.2;color:var(--v1)}
body,p,td,th,li,label{line-height:1.5}
.card,.sede-card{border-radius:14px;border:1px solid #e6e1d6;box-shadow:0 2px 10px rgba(37,40,31,.06)}
.sede-card{box-shadow:none}
button,.btn,.btn-h,input,select,textarea{border-radius:10px}

@media (max-width:640px){
  .wrap{padding:14px 12px 48px}
  .header{padding:13px 14px}
  .brand{font-size:14px}
  .card{padding:16px 14px;overflow-x:auto}
  .sedes-grid,.presu-grid{grid-template-columns:1fr}
  table{font-size:11.5px}
  th,td{padding:7px 7px}
}
</style>

<body>

<div class="header">
  <div class="hdr-l">
    <div class="logo-ico">📈</div>
    <div>
      <div class="brand">Ventas por almacén</div>
      <div class="brand-sub">Comparativo Chigorodó vs Belén de Bajirá — solo lectura, Gerencia</div>
    </div>
  </div>
  <div class="hdr-r" id="hdr-r">
    <a class="btn-h" href="hub.html">← Hub</a>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="loading">Cargando...</div>
</div>

<script>
const SUPABASE_URL = 'https://fpqogvxssnoarzgxcitc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ccZF-8tenblFEah5lXfd3w_mYTHMtMC';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SEDES = ['Chigorodó', 'Belén de Bajirá'];
const RANGOS = [
  { id: 'hoy', nombre: 'Hoy' },
  { id: 'ayer', nombre: 'Ayer' },
  { id: 'semana', nombre: 'Esta semana' },
  { id: 'mes', nombre: 'Este mes' },
  { id: 'elegir-mes', nombre: 'Elegir un mes' },
  { id: 'custom', nombre: 'Rango personalizado' },
];

let ventas = [];
// Todo el historial de presupuesto_venta, indexado para poder prorratear
// cualquier rango de fechas (no solo el mes en curso):
// { 'Chigorodó': { '2026-9': { monto, punto_equilibrio }, ... }, ... }
let presupuestoTodo = {};
let filtroRango = 'mes';
let customDesde = '';
let customHasta = '';
let mesElegido = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;

function fmtMoneda(n) {
  return '$' + Math.round(n || 0).toLocaleString('es-CO');
}
// Ver nota en resumen-venta.html: usar toISOString() aquí daba la fecha en
// UTC, no en horario Colombia — entre 7pm y medianoche local eso ya es
// "mañana" en UTC, rompiendo "Hoy"/"Ayer"/"Esta semana". Corregido 16-sep-2026.
function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function sumarDias(iso, dias) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + dias);
  return d.toISOString().slice(0, 10);
}
function inicioSemanaISO() {
  const d = new Date();
  const dia = (d.getDay() + 6) % 7; // lunes=0
  d.setDate(d.getDate() - dia);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function inicioMesISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
}

function rangoFechas() {
  const hoy = hoyISO();
  if (filtroRango === 'hoy') return [hoy, hoy];
  if (filtroRango === 'ayer') { const a = sumarDias(hoy, -1); return [a, a]; }
  if (filtroRango === 'semana') return [inicioSemanaISO(), hoy];
  if (filtroRango === 'mes') return [inicioMesISO(), hoy];
  if (filtroRango === 'elegir-mes') {
    const [anio, mes] = mesElegido.split('-').map(Number);
    const desde = `${anio}-${String(mes).padStart(2, '0')}-01`;
    const ultimoDia = new Date(anio, mes, 0).getDate();
    const hasta = `${anio}-${String(mes).padStart(2, '0')}-${String(ultimoDia).padStart(2, '0')}`;
    return [desde, hasta];
  }
  return [customDesde || hoy, customHasta || hoy];
}

function filtrarPorRango(filas, desde, hasta) {
  return filas.filter(v => v.fecha && v.fecha >= desde && v.fecha <= hasta);
}

// Totales por sede: vendido / contado / crédito / # facturas, para un
// conjunto de filas ya filtrado por fecha.
function statsPorSede(filas) {
  const r = {};
  SEDES.forEach(s => r[s] = { total: 0, contado: 0, credito: 0, facturas: new Set() });
  filas.forEach(v => {
    if (!v.sede || !r[v.sede]) return; // ventas sin sede reconocida no entran en el comparativo
    const valor = Number(v.valor) || 0;
    r[v.sede].total += valor;
    if (v.forma_pago === 'Contado') r[v.sede].contado += valor;
    else if (v.forma_pago === 'Crédito') r[v.sede].credito += valor;
    r[v.sede].facturas.add(v.factura);
  });
  return r;
}

// Meses del año en curso, de enero al mes actual (año a la fecha) — antes
// mostraba "últimos 12 meses" en ventana móvil, lo que podía mezclar dos
// años calendario distintos; ahora siempre arranca en enero (Carlos, 16-sep-2026).
function mesesDelAnio() {
  const hoy = new Date();
  const anio = hoy.getFullYear();
  const mesActual = hoy.getMonth() + 1;
  const meses = [];
  for (let mes = 1; mes <= mesActual; mes++) {
    meses.push({
      anio,
      mes,
      etiqueta: new Date(anio, mes - 1, 1).toLocaleDateString('es-CO', { month: 'short', year: 'numeric' }),
      esActual: mes === mesActual,
    });
  }
  return meses;
}

function tablaMensual(todasVentas, meses) {
  return meses.map(({ anio, mes, etiqueta, esActual }) => {
    const desde = `${anio}-${String(mes).padStart(2, '0')}-01`;
    const ultimoDia = new Date(anio, mes, 0).getDate();
    const hasta = `${anio}-${String(mes).padStart(2, '0')}-${String(ultimoDia).padStart(2, '0')}`;
    const porSede = statsPorSede(filtrarPorRango(todasVentas, desde, hasta));
    const totalGeneral = SEDES.reduce((acc, s) => acc + porSede[s].total, 0);
    // Meta combinada del mes (suma de la meta de las 2 sedes, si existe).
    const meta = SEDES.reduce((acc, s) => acc + (presupuestoTodo[s]?.[`${anio}-${mes}`]?.monto || 0), 0);
    const pctCumplimiento = meta ? Math.round((totalGeneral / meta) * 1000) / 10 : null;
    return { etiqueta, porSede, totalGeneral, esActual, meta, pctCumplimiento };
  });
}

// --- Fase 39: punto de equilibrio semanal (solo ventas de contado) ---

// Número de semana ISO 8601 (lunes a domingo, la semana 1 es la que
// contiene el primer jueves del año) — misma convención que usa el
// Power BI de Gerencia, para que los números de semana coincidan.
function isoSemanaNumero(fechaISO) {
  const d = new Date(fechaISO + 'T00:00:00');
  const diaLunes0 = (d.getDay() + 6) % 7; // lunes=0 ... domingo=6
  d.setDate(d.getDate() - diaLunes0 + 3); // jueves de esa semana
  const primerJueves = new Date(d.getFullYear(), 0, 4);
  const diaLunes0Jueves = (primerJueves.getDay() + 6) % 7;
  primerJueves.setDate(primerJueves.getDate() - diaLunes0Jueves + 3);
  return 1 + Math.round((d - primerJueves) / (7 * 86400000));
}

function diasEnMes(anio, mes) {
  return new Date(anio, mes, 0).getDate();
}

// Tasa diaria de un campo ('monto' o 'punto_equilibrio') de una sede,
// para el mes al que pertenece esa fecha. null si no hay meta cargada
// para ese mes.
function tasaDiaria(sede, fechaISO, campo) {
  const [anio, mes] = fechaISO.split('-').map(Number);
  const fila = presupuestoTodo[sede]?.[`${anio}-${mes}`];
  if (!fila || fila[campo] == null) return null;
  return fila[campo] / diasEnMes(anio, mes);
}

// Recorre día por día el rango [desde,hasta] y prorratea una meta
// mensual acorde a cuántos días de cada mes caen en ese rango — así
// "Cumplimiento de presupuesto" y "Punto de equilibrio" siguen el
// mismo rango de fecha elegido arriba, no solo el mes en curso.
// Devuelve el total prorrateado, si falta meta en algún día del rango,
// y el desglose por semana ISO (para la gráfica semanal).
function prorratearPorDia(sede, desde, hasta, campo) {
  let total = 0;
  let faltan = false;
  const porSemana = {};
  let d = new Date(desde + 'T00:00:00');
  const fin = new Date(hasta + 'T00:00:00');
  while (d <= fin) {
    const iso = d.toISOString().slice(0, 10);
    const tasa = tasaDiaria(sede, iso, campo);
    if (tasa == null) {
      faltan = true;
    } else {
      total += tasa;
      const sem = isoSemanaNumero(iso);
      porSemana[sem] = (porSemana[sem] || 0) + tasa;
    }
    d.setDate(d.getDate() + 1);
  }
  return { total, faltan, porSemana };
}

function fmtFechaCorta(iso) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
}

// Mini gráfica de barras en SVG: una barra por semana (contado real),
// verde si alcanzó la meta de esa semana, vino si quedó por debajo.
// Cada semana trae su propia meta (semanas parciales en los bordes del
// rango — o a caballo entre dos meses — no pesan igual que una semana
// completa), marcada con una muesca punteada sobre su barra.
// El texto "Meta X M" se coloca a la DERECHA de la línea punteada (no
// centrado sobre la barra) para que nunca se encime con el valor real
// que va arriba de la barra — antes ambos textos competían por el mismo
// espacio vertical y quedaban ilegibles cuando el valor y la meta eran
// cercanos (reportado por Carlos, 16-sep-2026).
// semanas: [{ semana, contado, meta }]
function svgSemanal(semanas) {
  const anchoBarra = 46, espacio = 30, alto = 140, margenIzq = 4, margenSup = 16, margenDer = 74;
  const maxValor = Math.max(...semanas.map(s => Math.max(s.contado, s.meta)), 1) * 1.15;
  const escala = (alto - margenSup) / maxValor;
  const anchoTotal = semanas.length * (anchoBarra + espacio) - espacio + margenIzq + margenDer;

  const barras = semanas.map((s, i) => {
    const x = margenIzq + i * (anchoBarra + espacio);
    const h = Math.max(s.contado * escala, 1);
    const y = alto - h;
    const yMeta = alto - s.meta * escala;
    const alcanzo = s.contado >= s.meta;
    return `
      <text x="${x + anchoBarra / 2}" y="${y - 8}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${alcanzo ? '#256d3b' : '#984745'}">${(s.contado / 1000000).toFixed(1)}M</text>
      <rect x="${x}" y="${y}" width="${anchoBarra}" height="${h}" rx="4" fill="${alcanzo ? '#4f7c5a' : '#c97b78'}"></rect>
      <line x1="${x - 3}" y1="${yMeta}" x2="${x + anchoBarra + 8}" y2="${yMeta}" stroke="#33513a" stroke-width="1.5" stroke-dasharray="4,3"></line>
      <text x="${x + anchoBarra + 11}" y="${yMeta + 3}" text-anchor="start" font-size="9" font-weight="700" fill="#33513a">Meta ${(s.meta / 1000000).toFixed(1)}M</text>
      <text x="${x + anchoBarra / 2}" y="${alto + 18}" text-anchor="middle" font-size="10.5" fill="#888">Sem. ${s.semana}</text>
    `;
  }).join('');

  return `
    <svg width="${anchoTotal}" height="${alto + 30}" viewBox="0 0 ${anchoTotal} ${alto + 30}" style="max-width:100%">
      ${barras}
    </svg>
  `;
}

function render() {
  const [desde, hasta] = rangoFechas();
  const filtradas = filtrarPorRango(ventas, desde, hasta);
  const porSede = statsPorSede(filtradas);
  const etiquetaRango = desde === hasta ? fmtFechaCorta(desde) : `${fmtFechaCorta(desde)} → ${fmtFechaCorta(hasta)}`;

  // Total combinado de las 2 sedes para el rango elegido (punto 1).
  const totalCombinado = SEDES.reduce((acc, s) => acc + porSede[s].total, 0);
  const contadoCombinado = SEDES.reduce((acc, s) => acc + porSede[s].contado, 0);
  const creditoCombinado = SEDES.reduce((acc, s) => acc + porSede[s].credito, 0);
  const facturasCombinado = SEDES.reduce((acc, s) => acc + porSede[s].facturas.size, 0);

  const meses = mesesDelAnio();
  const filas = tablaMensual(ventas, meses);
  // Totales del año a la fecha, para la fila final de la tabla (punto 5).
  const totalAnioChigorodo = filas.reduce((acc, f) => acc + f.porSede['Chigorodó'].total, 0);
  const totalAnioBajira = filas.reduce((acc, f) => acc + f.porSede['Belén de Bajirá'].total, 0);
  const totalAnioGeneral = totalAnioChigorodo + totalAnioBajira;
  const totalAnioMeta = filas.reduce((acc, f) => acc + f.meta, 0);
  const pctAnio = totalAnioMeta ? Math.round((totalAnioGeneral / totalAnioMeta) * 1000) / 10 : null;

  document.getElementById('wrap').innerHTML = `
    <div class="aviso">
      ℹ️ Solo lectura desde SAP. No reemplaza 2.3 (Registro de ventas, detalle transaccional) — este es el consolidado ejecutivo que compara ambas sedes. El presupuesto es la meta que Gerencia define en "Configurar presupuesto"; si una sede no tiene meta cargada para el rango elegido, se indica en vez de mostrar un porcentaje.
    </div>

    <div class="filtro-grupo">
      <span class="filtro-label">Rango de fecha</span>
      ${RANGOS.map(r => `<button class="filtro-chip ${r.id === filtroRango ? 'act' : ''}" data-rango="${r.id}">${r.nombre}</button>`).join('')}
    </div>
    ${filtroRango === 'custom' ? `
    <div class="rango-custom">
      <input type="date" id="f-desde" value="${customDesde}"> <span>a</span> <input type="date" id="f-hasta" value="${customHasta}">
    </div>` : ''}
    ${filtroRango === 'elegir-mes' ? `
    <div class="rango-custom">
      <input type="month" id="f-mes" value="${mesElegido}">
    </div>` : ''}

    <div class="card">
      <h3>💰 Total vendido (ambas sedes)</h3>
      <div class="sub">${etiquetaRango}</div>
      <div style="font-size:34px;font-weight:800;color:var(--v1);margin-bottom:6px">${fmtMoneda(totalCombinado)}</div>
      <div style="font-size:12px;color:#777">${facturasCombinado} factura${facturasCombinado === 1 ? '' : 's'} · Contado ${fmtMoneda(contadoCombinado)} · Crédito ${fmtMoneda(creditoCombinado)}</div>
    </div>

    <div class="card">
      <h3>🏬 Comparativo por sede</h3>
      <div class="sub">Según el rango seleccionado arriba</div>
      <div class="sedes-grid">
        ${SEDES.map(sede => {
          const s = porSede[sede];
          return `
          <div class="sede-card">
            <div class="sede-nom">📍 ${sede}</div>
            <div class="sede-total">${fmtMoneda(s.total)}</div>
            <div class="sede-sub">${s.facturas.size} factura${s.facturas.size === 1 ? '' : 's'} · ticket prom. ${fmtMoneda(s.facturas.size ? s.total / s.facturas.size : 0)}</div>
            <div class="sede-mini"><span>Contado</span><b>${fmtMoneda(s.contado)}</b></div>
            <div class="sede-mini credito"><span>Crédito</span><b>${fmtMoneda(s.credito)}</b></div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <h3>🎯 Cumplimiento de presupuesto por sede</h3>
      <div class="sub">${etiquetaRango} — la meta mensual se prorratea a los días del rango elegido arriba. Se mide solo con ventas de contado; el crédito no cuenta para la meta de la sede.</div>
      <div class="presu-grid">
        ${SEDES.map(sede => {
          // La meta de cada sede se mide solo contra contado — el crédito
          // no cuenta para el cumplimiento de la sede (es utilidad de los
          // dueños). El total contado+crédito solo se usa en 1.3, a nivel
          // de toda la agrotienda. La meta mensual se prorratea día a día
          // al rango elegido arriba (si el rango cruza meses, cada día usa
          // la meta de su propio mes).
          const { total: meta, faltan } = prorratearPorDia(sede, desde, hasta, 'monto');
          const vendido = porSede[sede].contado;
          const pct = meta ? Math.round((vendido / meta) * 1000) / 10 : null;
          return `
          <div class="presu-item">
            <div class="presu-nom">📍 ${sede}</div>
            ${meta ? `
              <div class="presu-pct">${pct}%</div>
              <div class="presu-barra"><div class="presu-fill ${pct >= 100 ? 'superado' : ''}" style="width:${Math.min(pct, 100)}%"></div></div>
              <div class="presu-datos">
                <span>${fmtMoneda(vendido)} de ${fmtMoneda(meta)} (solo contado)${faltan ? ' · faltan meses con presupuesto en este rango' : ''}</span>
              </div>
            ` : `<div class="vacio" style="padding:16px 0">Sin presupuesto cargado para este rango.</div>`}
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <h3>📉 Punto de equilibrio — solo ventas de contado</h3>
      <div class="sub">${etiquetaRango}. Barra = venta real de contado por semana; línea punteada = punto de equilibrio de esa semana.</div>
      <div class="presu-grid">
        ${SEDES.map(sede => {
          const { total: metaRango, porSemana: metaPorSemana } = prorratearPorDia(sede, desde, hasta, 'punto_equilibrio');
          if (!metaRango) return `<div class="presu-item"><div class="presu-nom">📍 ${sede}</div><div class="vacio" style="padding:16px 0">Sin punto de equilibrio cargado para este rango.</div></div>`;

          const actualPorSemana = {};
          filtradas.forEach(v => {
            if (v.sede !== sede || v.forma_pago !== 'Contado') return;
            const s = isoSemanaNumero(v.fecha);
            actualPorSemana[s] = (actualPorSemana[s] || 0) + (Number(v.valor) || 0);
          });
          const numerosSemana = Array.from(new Set([...Object.keys(metaPorSemana), ...Object.keys(actualPorSemana)].map(Number))).sort((a, b) => a - b);
          const semanas = numerosSemana.map(s => ({ semana: s, contado: actualPorSemana[s] || 0, meta: metaPorSemana[s] || 0 }));
          const demasiadasSemanas = semanas.length > 14;

          return `
          <div class="presu-item">
            <div class="presu-nom">📍 ${sede}</div>
            ${demasiadasSemanas
              ? `<div class="vacio" style="padding:16px 0">El rango elegido tiene ${semanas.length} semanas — elige un rango más corto (por ejemplo, un mes) para ver el gráfico semanal.</div>`
              : (semanas.length > 1 ? svgSemanal(semanas) : `<div class="vacio" style="padding:16px 0">El rango elegido no cubre ninguna semana completa todavía.</div>`)}
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <h3>📆 Detalle mensual comparado</h3>
      <div class="sub">Año en curso, de enero al mes actual — total vendido, meta y % de cumplimiento por mes</div>
      <table>
        <thead><tr><th>Mes</th><th class="num">Chigorodó</th><th class="num">Belén de Bajirá</th><th class="num">Total</th><th class="num">Meta</th><th class="num">% Cumplimiento</th></tr></thead>
        <tbody>
          ${filas.map(f => `
            <tr>
              <td class="${f.esActual ? 'mes-actual' : ''}">${f.etiqueta}${f.esActual ? ' (en curso)' : ''}</td>
              <td class="num">${fmtMoneda(f.porSede['Chigorodó'].total)}</td>
              <td class="num">${fmtMoneda(f.porSede['Belén de Bajirá'].total)}</td>
              <td class="num"><b>${fmtMoneda(f.totalGeneral)}</b></td>
              <td class="num">${f.meta ? fmtMoneda(f.meta) : '—'}</td>
              <td class="num">${f.pctCumplimiento == null ? '—' : `${f.pctCumplimiento}%`}</td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td><b>Total año</b></td>
            <td class="num"><b>${fmtMoneda(totalAnioChigorodo)}</b></td>
            <td class="num"><b>${fmtMoneda(totalAnioBajira)}</b></td>
            <td class="num"><b>${fmtMoneda(totalAnioGeneral)}</b></td>
            <td class="num"><b>${totalAnioMeta ? fmtMoneda(totalAnioMeta) : '—'}</b></td>
            <td class="num"><b>${pctAnio == null ? '—' : `${pctAnio}%`}</b></td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;

  document.querySelectorAll('[data-rango]').forEach(btn => {
    btn.addEventListener('click', () => { filtroRango = btn.dataset.rango; render(); });
  });
  document.getElementById('f-desde')?.addEventListener('change', (e) => { customDesde = e.target.value; render(); });
  document.getElementById('f-hasta')?.addEventListener('change', (e) => { customHasta = e.target.value; render(); });
  document.getElementById('f-mes')?.addEventListener('change', (e) => { mesElegido = e.target.value; render(); });
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  const userId = session.user.id;
  const [{ data: perfil }, { data: permisos }] = await Promise.all([
    sb.from('perfiles').select('*').eq('id', userId).single(),
    sb.from('permisos_modulo').select('*').eq('perfil_id', userId),
  ]);
  if (!perfil) {
    document.getElementById('wrap').innerHTML = '<div class="loading">Tu usuario no tiene un perfil configurado todavía.</div>';
    return;
  }
  const esSuperAdmin = perfil.es_super_admin;
  const nivel3 = (permisos || []).find(p => p.modulo === 3)?.nivel || 'inactivo';
  const puedeVer = esSuperAdmin || nivel3 !== 'inactivo';
  if (!puedeVer) {
    document.getElementById('wrap').innerHTML = '<div class="loading">No tienes permiso para ver este módulo.</div>';
    return;
  }
  if (esSuperAdmin) {
    document.getElementById('hdr-r').innerHTML = `
      <a class="btn-h" href="configurar-presupuesto.html">🎯 Configurar presupuesto</a>
      <a class="btn-h" href="hub.html">← Hub</a>
    `;
  }

  // Igual que en 1.3: Supabase limita cuántas filas devuelve una sola
  // consulta, así que se trae todo en páginas con .range().
  let ventasCargadas = [];
  let errVentas = null;
  const PAGINA = 1000;
  let desde = 0;
  while (true) {
    const { data, error } = await sb.from('ventas').select('factura,fecha,valor,sede,forma_pago').order('fecha', { ascending: false }).range(desde, desde + PAGINA - 1);
    if (error) { errVentas = error; break; }
    ventasCargadas = ventasCargadas.concat(data || []);
    if (!data || data.length < PAGINA) break;
    desde += PAGINA;
  }
  if (errVentas) {
    document.getElementById('wrap').innerHTML = '<div class="loading">No se pudo cargar el histórico de ventas: ' + errVentas.message + '</div>';
    return;
  }
  ventas = ventasCargadas;

  // Se trae todo el historial de presupuesto_venta (es una tabla chica,
  // una fila por sede/mes) para poder prorratear cualquier rango de
  // fecha que se elija arriba, no solo el mes en curso.
  const { data: presuFilas } = await sb.from('presupuesto_venta').select('*');
  presupuestoTodo = {};
  SEDES.forEach(s => presupuestoTodo[s] = {});
  (presuFilas || []).forEach(r => {
    if (!SEDES.includes(r.sede)) return;
    presupuestoTodo[r.sede][`${r.anio}-${r.mes}`] = { monto: Number(r.monto) || 0, punto_equilibrio: Number(r.punto_equilibrio) || 0 };
  });

  render();
})();
</script>
