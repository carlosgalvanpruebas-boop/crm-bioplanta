<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrotienda Bioplanta · Iniciar sesión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v1:#33513a;--v2:#4f7c5a;--v3:#84a38c;--v4:#a9c2af;--vbg:#eaefeb;--vlt:#f4f8f5;--texto:#1a2e1a}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--v1),var(--v2) 60%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:18px;padding:36px 32px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.logo-ico{font-size:34px;text-align:center}
.brand{font-size:16px;font-weight:800;color:var(--v1);text-align:center;margin-top:4px}
.sub{font-size:12px;color:#666;text-align:center;margin-top:2px;margin-bottom:22px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--v2)}
.field input{border:1.5px solid #b7e4c7;border-radius:8px;padding:11px 12px;font-size:14px;font-family:inherit;outline:none}
.field input:focus{border-color:var(--v3);box-shadow:0 0 0 3px rgba(64,145,108,.12)}
.btn{width:100%;margin-top:10px;padding:13px;background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.6}
.msg{margin-top:14px;padding:9px 12px;border-radius:8px;font-size:13px;text-align:center;display:none}
.msg.err{background:#fde8e8;color:#a00;display:block}
.msg.ok{background:#e6f4ea;color:#256d3b;display:block}
.back{display:block;text-align:center;margin-top:18px;font-size:12px;color:var(--v2);text-decoration:none}
.olvide{display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--v2);text-decoration:underline;background:none;border:none;cursor:pointer;font-family:inherit;width:100%}
.separador{display:flex;align-items:center;gap:10px;margin:18px 0;color:#999;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.separador::before,.separador::after{content:'';flex:1;height:1px;background:#e2e8e3}
.btn-ms{width:100%;padding:11px;background:#fff;color:#3c3c3c;border:1.5px solid #d8dfd9;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-ms:hover{background:#f7f9f7;border-color:#c3cec5}
.btn-ms:disabled{opacity:.6;cursor:default}

/* === Fase 36: rediseno visual desde cero con los 3 colores oficiales de marca (verde #4f7c5a, vino #984745, beige #E6CEAB), tipografia profesional, logo real y mejor contraste === */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{--vlt:#faf8f4;--gris:#f6f4f0;--texto:#25281f;--beige-lt:#f6ecdd;--vino-lt:#f3e8e7}
html,body{font-family:'Plus Jakarta Sans',Inter,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--vlt)}
button,input,select,textarea{font-family:inherit}
h1,h2,h3{font-weight:800;letter-spacing:-.015em;line-height:1.2;color:var(--v1)}
body,p,td,th,li,label{line-height:1.5}
.brand,.sec-t{font-weight:700;letter-spacing:-.005em}
.brand-sub,.slogan{color:var(--v2);font-weight:500}
.card,.ind,.grp,.box,.form-box,.rowcard,.col,.card-t,.search-box,.pend-header,.pend-card,.intro,.tabla-wrap,.stat-box,.bloqueo{border-radius:14px;border:1px solid #e6e1d6;box-shadow:0 2px 10px rgba(37,40,31,.06)}
button,.btn,.btn-out,.btn-ms,.btn-save,.btn-h-act,.btn-exportar,input,select,textarea{border-radius:10px}
.btn,.btn-save,.btn-h-act,.btn-exportar{font-weight:600;letter-spacing:.01em;transition:transform .12s,box-shadow .12s,background .12s,filter .12s}
.btn:hover,.btn-save:hover,.btn-h-act:hover,.btn-exportar:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(37,40,31,.16);filter:brightness(1.05)}
.btn-out{font-weight:600;border-width:1.5px}
a:focus-visible,button:focus-visible,.btn:focus-visible,.btn-out:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--v2);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}
.brand-logo{height:42px;width:auto;display:block}
.brand-logo-lg{height:60px;width:auto;display:block}

@media (max-width:640px){
  .wrap{padding:14px 12px 48px}
  .header{padding:13px 14px}
  .brand{font-size:14px}
  .card,.box{padding:16px 14px;overflow-x:auto}
  table{font-size:11.5px}
  th,td{padding:7px 7px}
}
</style>
</head>
<body>

<div class="box" id="box-login">
  <img src="img/logo-bioplanta.png" alt="Agrotienda Bioplanta" class="brand-logo-lg" style="margin:0 auto 12px">
  <div class="brand">Equipo Agrotienda</div>
  <div class="sub">Ingresa con tu correo y contraseña</div>

  <form id="form-login">
    <div class="field">
      <label>Correo</label>
      <input type="email" id="email" required autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button class="btn" type="submit" id="btn-entrar">Entrar</button>
  </form>
  <div class="msg err" id="msg"></div>

  <div class="separador">o</div>
  <button class="btn-ms" id="btn-microsoft" type="button">
    <svg width="16" height="16" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
    Continuar con Microsoft
  </button>

  <button class="olvide" id="btn-olvide" type="button">¿Olvidaste tu contraseña?</button>

  <a class="back" href="index.html">&larr; Volver</a>
</div>

<div class="box" id="box-recuperar" style="display:none">
  <div class="logo-ico">🔑</div>
  <div class="brand">Recuperar contraseña</div>
  <div class="sub">Te enviamos un correo con un enlace para crear una nueva</div>

  <form id="form-recuperar">
    <div class="field">
      <label>Correo</label>
      <input type="email" id="email-recuperar" required autocomplete="username">
    </div>
    <button class="btn" type="submit" id="btn-recuperar">Enviar enlace</button>
  </form>
  <div class="msg" id="msg-recuperar" style="display:none"></div>
  <button class="olvide" id="btn-volver-login" type="button">&larr; Volver a iniciar sesión</button>
</div>

<script>
const SUPABASE_URL = 'https://fpqogvxssnoarzgxcitc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ccZF-8tenblFEah5lXfd3w_mYTHMtMC';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById('form-login');
const btn = document.getElementById('btn-entrar');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    msg.textContent = 'Correo o contraseña incorrectos.';
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  window.location.href = 'hub.html';
});

// Si ya hay sesión activa, saltar directo al Hub.
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) window.location.href = 'hub.html';
})();

// --- Iniciar sesión con Microsoft (Azure AD / Entra ID vía Supabase Auth) ---
// Requiere que el proveedor "Azure" esté activado en el panel de Supabase
// (Authentication → Providers → Azure), con el Client ID, Client Secret y
// el Tenant ID de una app registrada en Azure AD por el equipo de TI/M365
// de Bioplanta. Mientras eso no esté activado, este botón mostrará un
// error de Supabase indicando que el proveedor no está habilitado.
const btnMicrosoft = document.getElementById('btn-microsoft');
btnMicrosoft.addEventListener('click', async () => {
  btnMicrosoft.disabled = true;
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'azure',
    options: {
      scopes: 'email openid profile',
      redirectTo: window.location.origin + '/hub.html',
    },
  });
  if (error) {
    msg.textContent = 'No se pudo iniciar con Microsoft: ' + error.message;
    msg.style.display = 'block';
    btnMicrosoft.disabled = false;
  }
  // Si no hay error, Supabase redirige automáticamente a Microsoft para
  // iniciar sesión y luego de vuelta a hub.html.
});

// --- Recuperar contraseña ---
const boxLogin = document.getElementById('box-login');
const boxRecuperar = document.getElementById('box-recuperar');
const formRecuperar = document.getElementById('form-recuperar');
const btnRecuperar = document.getElementById('btn-recuperar');
const msgRecuperar = document.getElementById('msg-recuperar');

document.getElementById('btn-olvide').addEventListener('click', () => {
  boxLogin.style.display = 'none';
  boxRecuperar.style.display = 'block';
  msgRecuperar.style.display = 'none';
  formRecuperar.reset();
});

document.getElementById('btn-volver-login').addEventListener('click', () => {
  boxRecuperar.style.display = 'none';
  boxLogin.style.display = 'block';
});

formRecuperar.addEventListener('submit', async (e) => {
  e.preventDefault();
  btnRecuperar.disabled = true;
  btnRecuperar.textContent = 'Enviando...';
  msgRecuperar.style.display = 'none';

  const email = document.getElementById('email-recuperar').value.trim();
  const redirectTo = window.location.origin + '/restablecer-clave.html';
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

  btnRecuperar.disabled = false;
  btnRecuperar.textContent = 'Enviar enlace';

  // Se muestra el mismo mensaje exista o no esa cuenta, para no revelar
  // qué correos sí están registrados en el sistema.
  msgRecuperar.className = 'msg ok';
  msgRecuperar.textContent = 'Si ese correo está registrado, te llegará un enlace para crear una nueva contraseña. Revisa también la carpeta de spam.';
  msgRecuperar.style.display = 'block';
});
</script>

</body>
</html>
