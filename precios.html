<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrotienda Bioplanta · Precios</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v1:#33513a;--v2:#4f7c5a;--v3:#84a38c;--vbg:#eaefeb;--texto:#1a2e1a;--beige:#e6ceab}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--vbg);color:var(--texto);min-height:100vh}
.header{background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo-ico{font-size:26px}
.brand{font-size:15px;font-weight:800}
.brand-sub{font-size:11px;opacity:.8}
.back{color:#fff;text-decoration:none;font-size:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:7px 16px;border-radius:20px}
.wrap{max-width:560px;margin:60px auto;padding:0 16px;text-align:center}
.card{background:#fff;border-radius:16px;padding:40px 28px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.ico{font-size:44px;margin-bottom:14px}
.t{font-size:17px;font-weight:800;color:var(--v1);margin-bottom:10px}
.s{font-size:13px;color:#5a6e5e;line-height:1.6}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-l">
    <div class="logo-ico">🏷️</div>
    <div>
      <div class="brand">Agrotienda Bioplanta</div>
      <div class="brand-sub">Listado de precios</div>
    </div>
  </div>
  <a class="back" href="index.html">← Volver</a>
</div>

<div class="wrap">
  <div class="card">
    <div class="ico">🚧</div>
    <div class="t">Muy pronto</div>
    <div class="s">
      Esta sección mostrará el listado de precios y disponibilidad, actualizado directamente desde SAP Business One.<br><br>
      Todavía no está conectada la sincronización real con SAP, así que por ahora esta página queda como espacio reservado.
    </div>
  </div>
</div>

</body>
</html>
