<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrotienda Bioplanta · Precios</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v1:#33513a;--v2:#4f7c5a;--v3:#84a38c;--v4:#a9c2af;--vbg:#eaefeb;--vlt:#f4f8f5;--texto:#1a2e1a;--beige:#e6ceab;--vino:#984745}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--vbg);color:var(--texto);min-height:100vh}
.header{background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo-ico{font-size:26px}
.brand{font-size:15px;font-weight:800}
.brand-sub{font-size:11px;opacity:.8}
.back{color:#fff;text-decoration:none;font-size:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:7px 16px;border-radius:20px}

.wrap{max-width:900px;margin:0 auto;padding:18px 18px 60px}
.loading{text-align:center;padding:80px;color:#888}
.aviso{background:var(--beige);color:var(--v1);border-radius:10px;padding:10px 16px;font-size:12px;margin-bottom:16px;line-height:1.5}

.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filtros input,.filtros select{border:1.5px solid #d6e2d9;border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff}
.filtros input{flex:1;min-width:180px}

.contador{font-size:12px;color:#777;margin-bottom:10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card .cat{font-size:10px;font-weight:700;color:var(--v2);text-transform:uppercase;letter-spacing:.3px}
.card .nom{font-size:13.5px;font-weight:700;color:var(--v1);margin:6px 0 10px;line-height:1.35;min-height:36px}
.card .precio{font-size:19px;font-weight:800;color:var(--v1)}
.card .stock{font-size:11.5px;margin-top:6px;font-weight:700}
.stock.si{color:#256d3b}
.stock.no{color:var(--vino)}

.vacio{text-align:center;color:#999;padding:50px;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-l">
    <div class="logo-ico">🏷️</div>
    <div>
      <div class="brand">Agrotienda Bioplanta</div>
      <div class="brand-sub">Listado de precios</div>
    </div>
  </div>
  <a class="back" href="index.html">← Volver</a>
</div>

<div class="wrap" id="wrap">
  <div class="loading">Cargando...</div>
</div>

<script>
const SUPABASE_URL = 'https://fpqogvxssnoarzgxcitc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ccZF-8tenblFEah5lXfd3w_mYTHMtMC';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let productos = [];
let categoriaActiva = '';
let busqueda = '';

function fmtMoneda(n) {
  return '$' + Math.round(n || 0).toLocaleString('es-CO');
}

function aplicarFiltros() {
  return productos.filter(p => {
    if (categoriaActiva && p.categoria !== categoriaActiva) return false;
    if (busqueda && !p.producto.toLowerCase().includes(busqueda.toLowerCase())) return false;
    return true;
  });
}

function render() {
  const categorias = [...new Set(productos.map(p => p.categoria))].sort();
  const filtrados = aplicarFiltros().sort((a, b) => a.producto.localeCompare(b.producto));

  document.getElementById('wrap').innerHTML = `
    <div class="aviso">
      ℹ️ Precio único de venta, igual para todos los clientes. El stock mostrado es el disponible actualmente entre las dos sedes (Chigorodó y Belén de Bajirá) — todavía no podemos separarlo por sede en esta pantalla.
    </div>
    <div class="filtros">
      <input type="text" id="f-busqueda" placeholder="🔎 Buscar producto..." value="${busqueda}">
      <select id="f-categoria">
        <option value="">Todas las categorías</option>
        ${categorias.map(c => `<option value="${c}" ${c === categoriaActiva ? 'selected' : ''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="contador">${filtrados.length} producto${filtrados.length === 1 ? '' : 's'}</div>
    ${filtrados.length ? `
    <div class="grid">
      ${filtrados.map(p => `
        <div class="card">
          <div class="cat">${p.categoria}</div>
          <div class="nom">${p.producto}</div>
          <div class="precio">${fmtMoneda(p.precio)}</div>
          <div class="stock ${p.stock > 0 ? 'si' : 'no'}">${p.stock > 0 ? `✅ Disponible (${p.stock} und.)` : '❌ Sin stock'}</div>
        </div>
      `).join('')}
    </div>` : `<div class="vacio">No se encontraron productos con ese filtro.</div>`}
  `;

  document.getElementById('f-busqueda').addEventListener('input', (e) => {
    busqueda = e.target.value;
    render();
    const campo = document.getElementById('f-busqueda');
    campo.focus();
    campo.setSelectionRange(campo.value.length, campo.value.length);
  });
  document.getElementById('f-categoria').addEventListener('change', (e) => {
    categoriaActiva = e.target.value;
    render();
  });
}

(async () => {
  const { data, error } = await sb.from('listado_precios_publico').select('*');
  if (error) {
    document.getElementById('wrap').innerHTML = `<div class="loading">No se pudo cargar el listado de precios. Intenta de nuevo más tarde.</div>`;
    return;
  }
  productos = data || [];
  render();
})();
</script>

</body>
</html>
