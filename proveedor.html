<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrotienda Bioplanta · Proveedor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v1:#33513a;--v2:#4f7c5a;--v3:#84a38c;--v4:#a9c2af;--vbg:#eaefeb;--vlt:#f4f8f5;--texto:#1a2e1a;--beige:#e6ceab;--vino:#984745}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--vbg);color:var(--texto);min-height:100vh;font-size:14px}
.header{background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo-ico{font-size:26px}
.brand{font-size:15px;font-weight:800}
.brand-sub{font-size:11px;opacity:.8}
.back{color:#fff;text-decoration:none;font-size:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:7px 16px;border-radius:20px}

.wrap{max-width:560px;margin:26px auto;padding:0 16px 60px}
.intro{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.07);font-size:13px;line-height:1.5;color:#4a5a4a}
.form-box{background:#fff;border-radius:14px;padding:22px 20px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--v2)}
.field input,.field select,.field textarea{border:1.5px solid #b7e4c7;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;color:var(--texto);background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--v3);box-shadow:0 0 0 3px rgba(64,145,108,.12)}
.field textarea{resize:vertical}
.hint{font-size:11px;color:#888;margin-top:2px}
.btn-save{width:100%;margin-top:8px;padding:14px;background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:disabled{opacity:.55;cursor:default}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:14px;text-align:center;display:none}
.msg.ok{background:var(--vbg);color:var(--v1);display:block}
.msg.err{background:#fde8e8;color:#a00;display:block}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-l">
    <div class="logo-ico">📎</div>
    <div>
      <div class="brand">Agrotienda Bioplanta</div>
      <div class="brand-sub">Cotización de proveedor</div>
    </div>
  </div>
  <a class="back" href="index.html">← Volver</a>
</div>

<div class="wrap">
  <div class="intro">
    Sube aquí la cotización de tu producto o servicio. No necesitas usuario ni contraseña — este formulario es de acceso público para todos los proveedores de Bioplanta.
  </div>

  <div class="form-box">
    <div class="field">
      <label>Nombre de la empresa / proveedor *</label>
      <input type="text" id="f-nombre" placeholder="Ej. Agroinsumos del Urabá S.A.S." autocomplete="off">
    </div>
    <div class="field">
      <label>Producto o servicio cotizado *</label>
      <input type="text" id="f-producto" placeholder="Ej. Fertilizante triple 15 x bulto 50kg" autocomplete="off">
    </div>
    <div class="field">
      <label>Sede a la que aplica</label>
      <select id="f-sede">
        <option value="Ambas">Ambas sedes</option>
        <option value="Chigorodó">Chigorodó</option>
        <option value="Belén de Bajirá">Belén de Bajirá</option>
      </select>
    </div>
    <div class="field">
      <label>Valor cotizado (COP)</label>
      <input type="number" id="f-valor" placeholder="Ej. 85000" min="0" step="1">
    </div>
    <div class="field">
      <label>Archivo de la cotización (PDF, imagen, Excel) *</label>
      <input type="file" id="f-archivo" accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx,.doc,.docx">
      <div class="hint">Máximo 10 MB.</div>
    </div>
    <div class="field">
      <label>Observación (opcional)</label>
      <textarea id="f-obs" rows="2" placeholder="Condiciones de pago, tiempo de entrega, etc."></textarea>
    </div>
    <button class="btn-save" id="btn-guardar">Enviar cotización</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fpqogvxssnoarzgxcitc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ccZF-8tenblFEah5lXfd3w_mYTHMtMC';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = 'cotizaciones-proveedor';
const MAX_MB = 10;

function showMsg(txt, tipo) {
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.className = 'msg ' + tipo;
}

document.getElementById('btn-guardar').addEventListener('click', async () => {
  const nombre    = document.getElementById('f-nombre').value.trim();
  const producto  = document.getElementById('f-producto').value.trim();
  const sede      = document.getElementById('f-sede').value;
  const valorVal  = document.getElementById('f-valor').value;
  const obs       = document.getElementById('f-obs').value.trim();
  const archivo   = document.getElementById('f-archivo').files[0];

  if (!nombre)    { showMsg('⚠️ El nombre del proveedor es obligatorio', 'err'); return; }
  if (!producto)  { showMsg('⚠️ El producto o servicio es obligatorio', 'err'); return; }
  if (!archivo)   { showMsg('⚠️ Debes adjuntar el archivo de la cotización', 'err'); return; }
  if (archivo.size > MAX_MB * 1024 * 1024) { showMsg(`⚠️ El archivo supera los ${MAX_MB} MB`, 'err'); return; }

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const ext = archivo.name.split('.').pop();
    const ruta = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;

    const { error: errSubida } = await sb.storage.from(BUCKET).upload(ruta, archivo);
    if (errSubida) {
      throw new Error('No se pudo subir el archivo. Es posible que el bucket de almacenamiento "cotizaciones-proveedor" todavía no exista — avísale a Carlos.');
    }

    const { data: pub } = sb.storage.from(BUCKET).getPublicUrl(ruta);
    const archivoUrl = pub.publicUrl;

    const { error: errInsert } = await sb.from('cotizaciones_proveedor').insert({
      proveedor_nombre:   nombre,
      producto_servicio:  producto,
      sede,
      valor_cotizado:     valorVal ? parseFloat(valorVal) : null,
      archivo_url:        archivoUrl,
      observacion:        obs || null,
    });
    if (errInsert) throw errInsert;

    showMsg('✅ ¡Cotización enviada! Gracias por tu tiempo.', 'ok');
    document.getElementById('f-nombre').value = '';
    document.getElementById('f-producto').value = '';
    document.getElementById('f-valor').value = '';
    document.getElementById('f-obs').value = '';
    document.getElementById('f-archivo').value = '';
    btn.disabled = false;
    btn.textContent = 'Enviar cotización';
  } catch (e) {
    showMsg('❌ ' + (e.message || 'Error al enviar. Intenta de nuevo.'), 'err');
    btn.disabled = false;
    btn.textContent = 'Enviar cotización';
  }
});
</script>

</body>
</html>
