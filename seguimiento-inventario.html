<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrotienda Bioplanta · Seguimiento de inventario</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v1:#33513a;--v2:#4f7c5a;--v3:#84a38c;--v4:#a9c2af;--vbg:#eaefeb;--vlt:#f4f8f5;--texto:#1a2e1a;--beige:#e6ceab;--vino:#984745}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f0;color:var(--texto);min-height:100vh}
.header{background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo-ico{font-size:26px}
.brand{font-size:15px;font-weight:800}
.brand-sub{font-size:11px;opacity:.8}
.btn-h{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 60px}
.loading{text-align:center;padding:80px;color:#888}
.aviso{background:var(--beige);color:var(--v1);border-radius:10px;padding:12px 16px;font-size:12.5px;margin-bottom:16px;line-height:1.5}
.indicadores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.ind{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ind b{display:block;font-size:22px;font-weight:800}
.ind span{font-size:11.5px;color:#777}
.ind.ok b{color:var(--v2)}
.ind.bajo b{color:#b8860b}
.ind.agotado b{color:var(--vino)}
.ind.sobre b{color:var(--v1)}
.ind.sinclasificar b{color:#888}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filtros select,.filtros input{border:1.5px solid #d6e2d9;border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit}
.filtros input{flex:1;min-width:180px}
.filtro-chip{background:#fff;border:1.5px solid var(--v3);color:var(--v2);padding:6px 13px;border-radius:16px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.filtro-chip.act{background:var(--v2);color:#fff;border-color:var(--v2)}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--vbg);flex-wrap:wrap}
.fila:last-child{border-bottom:none}
.f-info{flex:1;min-width:200px}
.f-prod{font-size:14px;font-weight:800;color:var(--v1)}
.f-meta{font-size:11.5px;color:#888;margin-top:2px}
.f-sedes{font-size:11px;color:var(--v2);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.f-sedes span{background:var(--vlt);border-radius:8px;padding:2px 8px;font-weight:600}
.f-datos{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.f-num{text-align:center}
.f-num b{display:block;font-size:15px}
.f-num span{font-size:10px;color:#888}
.badge{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap}
.b-ok{background:#e6f4ea;color:#256d3b}
.b-bajo{background:var(--beige);color:#8a5a00}
.b-agotado{background:#fde3e2;color:var(--vino)}
.b-sindatos{background:#eee;color:#999}
.b-sobre{background:var(--v4);color:var(--v1)}
.btn-mini{border:none;border-radius:7px;padding:8px 12px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700;background:var(--v2);color:#fff;white-space:nowrap}
.vacio{text-align:center;padding:40px;color:#999;font-size:13px}

/* === Fase 36: rediseno visual desde cero con los 3 colores oficiales de marca (verde #4f7c5a, vino #984745, beige #E6CEAB), tipografia profesional, logo real y mejor contraste === */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{--vlt:#faf8f4;--gris:#f6f4f0;--texto:#25281f;--beige-lt:#f6ecdd;--vino-lt:#f3e8e7}
html,body{font-family:'Plus Jakarta Sans',Inter,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--vlt)}
button,input,select,textarea{font-family:inherit}
h1,h2,h3{font-weight:800;letter-spacing:-.015em;line-height:1.2;color:var(--v1)}
body,p,td,th,li,label{line-height:1.5}
.brand,.sec-t{font-weight:700;letter-spacing:-.005em}
.brand-sub,.slogan{color:var(--v2);font-weight:500}
.card,.ind,.grp,.box,.form-box,.rowcard,.col,.card-t,.search-box,.pend-header,.pend-card,.intro,.tabla-wrap,.stat-box,.bloqueo{border-radius:14px;border:1px solid #e6e1d6;box-shadow:0 2px 10px rgba(37,40,31,.06)}
button,.btn,.btn-out,.btn-ms,.btn-save,.btn-h-act,.btn-exportar,input,select,textarea{border-radius:10px}
.btn,.btn-save,.btn-h-act,.btn-exportar{font-weight:600;letter-spacing:.01em;transition:transform .12s,box-shadow .12s,background .12s,filter .12s}
.btn:hover,.btn-save:hover,.btn-h-act:hover,.btn-exportar:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(37,40,31,.16);filter:brightness(1.05)}
.btn-out{font-weight:600;border-width:1.5px}
a:focus-visible,button:focus-visible,.btn:focus-visible,.btn-out:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--v2);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}
.brand-logo{height:42px;width:auto;display:block}
.brand-logo-lg{height:60px;width:auto;display:block}

@media (max-width:640px){
  .wrap{padding:14px 12px 48px}
  .header{padding:13px 14px}
  .brand{font-size:14px}
  .card,.ind{padding:16px 14px;overflow-x:auto}
  table{font-size:11.5px}
  th,td{padding:7px 7px}
}
</style>
</head>
<body>
<div class="header">
  <div class="hdr-l">
    <div class="logo-ico">📦</div>
    <div>
      <div class="brand">Seguimiento de inventario</div>
      <div class="brand-sub">Consulta rápida de existencias, solo lectura desde SAP</div>
    </div>
  </div>
  <a class="btn-h" href="hub.html">← Hub</a>
</div>
<div class="wrap" id="wrap">
  <div class="loading">Cargando...</div>
</div>
<script>
const SUPABASE_URL = 'https://fpqogvxssnoarzgxcitc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ccZF-8tenblFEah5lXfd3w_mYTHMtMC';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const SEDES = ['Chigorodó', 'Belén de Bajirá'];
let miPerfil = null;
let esSuperAdmin = false;
let productosPorSede = []; // filas crudas de `inventario`, una por artículo x sede
let productos = []; // agrupado por codigo_sap, con el desglose por sede adentro
let filtroSede = 'todas';
let filtroEstado = 'todos';
let filtroTexto = '';
// Fase 45 (21-sep, a pedido de Carlos): productos que se sacan de este
// reporte a propósito (ej. un agotado que ya no se va a volver a pedir)
// sin borrarlos de `inventario` — solo se ocultan de esta pantalla y de
// sus alertas. `inventario_descartados` es el "archivo" donde quedan
// guardados por si se cambia de opinión; `vista` alterna entre la lista
// activa y ese archivo.
let vista = 'activos'; // 'activos' | 'descartados'
let descartados = []; // filas de inventario_descartados
function fmtFecha(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString('es-CO');
}
// Agrupa las filas de `inventario` (una por artículo x sede desde la Fase 25) en un
// solo registro por artículo, con el total combinado y el desglose por sede adentro.
// El mínimo/máximo sugerido se calcula sobre el total de ventas del artículo (sin
// distinguir sede todavía), así que el estado también se evalúa sobre el total
// combinado — comparar el stock de una sola sede contra ese umbral daría falsas
// alertas de "stock bajo".
function agruparPorProducto(filas) {
  const grupos = {};
  filas.forEach(p => {
    const key = p.codigo_sap;
    if (!grupos[key]) {
      grupos[key] = {
        id: p.id,
        codigo_sap: p.codigo_sap,
        producto: p.producto,
        categoria: p.categoria,
        proveedor: p.proveedor,
        unidad: p.unidad,
        actualizado_en: p.actualizado_en,
        stock_minimo_sugerido: p.stock_minimo_sugerido,
        stock_maximo_sugerido: p.stock_maximo_sugerido,
        cantidad: 0,
        porSede: {},
      };
    }
    const g = grupos[key];
    const cant = Number(p.cantidad) || 0;
    g.cantidad += cant;
    g.porSede[p.sede] = (g.porSede[p.sede] || 0) + cant;
    if (p.actualizado_en && (!g.actualizado_en || p.actualizado_en > g.actualizado_en)) {
      g.actualizado_en = p.actualizado_en;
    }
  });
  return Object.values(grupos);
}
function calcularEstado(p) {
  const cantidad = Number(p.cantidad) || 0;
  if (cantidad <= 0) return 'agotado';
  if (p.stock_minimo_sugerido === null || p.stock_minimo_sugerido === undefined) return 'sindatos';
  if (cantidad < Number(p.stock_minimo_sugerido)) return 'bajo';
  if (p.stock_maximo_sugerido !== null && p.stock_maximo_sugerido !== undefined && cantidad > Number(p.stock_maximo_sugerido)) return 'sobre';
  return 'ok';
}
function badgeEstado(estado) {
  const map = {
    ok: { txt: 'En rango', cls: 'b-ok' },
    bajo: { txt: 'Stock bajo', cls: 'b-bajo' },
    agotado: { txt: 'Agotado', cls: 'b-agotado' },
    sobre: { txt: 'Sobre stock', cls: 'b-sobre' },
    sindatos: { txt: 'Sin datos suficientes', cls: 'b-sindatos' },
  }[estado];
  return `<span class="badge ${map.cls}">${map.txt}</span>`;
}
function renderIndicadores(lista) {
  const ok = lista.filter(p => calcularEstado(p) === 'ok').length;
  const bajo = lista.filter(p => calcularEstado(p) === 'bajo').length;
  const agotado = lista.filter(p => calcularEstado(p) === 'agotado').length;
  const sobre = lista.filter(p => calcularEstado(p) === 'sobre').length;
  return `
    <div class="indicadores">
      <div class="ind ok"><b>${ok}</b><span>En rango</span></div>
      <div class="ind bajo"><b>${bajo}</b><span>Stock bajo</span></div>
      <div class="ind agotado"><b>${agotado}</b><span>Agotados</span></div>
      <div class="ind sobre"><b>${sobre}</b><span>Sobre stock</span></div>
    </div>
  `;
}
function descartadosSet() {
  return new Set(descartados.map(d => d.codigo_sap));
}
function aplicarFiltros(lista) {
  return lista.filter(p => {
    if (filtroSede !== 'todas' && !(p.porSede[filtroSede] > 0)) return false;
    if (filtroEstado !== 'todos' && calcularEstado(p) !== filtroEstado) return false;
    if (filtroTexto && !(p.producto || '').toLowerCase().includes(filtroTexto.toLowerCase())) return false;
    return true;
  });
}
// Descartar/restaurar (Fase 45): descartar guarda el producto en
// `inventario_descartados` (con motivo opcional) y lo saca de la lista
// activa; restaurar simplemente borra esa fila, sin tocar `inventario`
// para nada — el stock real sigue viniendo de la carga de SAP como
// siempre, esto solo controla qué se muestra en este reporte.
async function cargarDescartados() {
  const { data, error } = await sb.from('inventario_descartados').select('*').order('descartado_en', { ascending: false });
  if (!error) descartados = data || [];
}
async function descartarProducto(codigo_sap) {
  const p = productos.find(x => x.codigo_sap === codigo_sap);
  const nombre = p ? p.producto : codigo_sap;
  const motivo = window.prompt(`¿Por qué se descarta "${nombre}" de esta lista? (opcional — queda guardado en "Descartados" y se puede restaurar cuando quieras)`, '');
  if (motivo === null) return; // canceló el prompt
  const { error } = await sb.from('inventario_descartados').upsert({
    codigo_sap,
    producto: p ? p.producto : null,
    categoria: p ? p.categoria : null,
    motivo: motivo.trim() || null,
    descartado_por: miPerfil?.id || null,
    descartado_por_nombre: miPerfil?.nombre || null,
    descartado_en: new Date().toISOString(),
  });
  if (error) { alert('No se pudo descartar: ' + error.message); return; }
  await cargarDescartados();
  render();
}
async function restaurarProducto(codigo_sap) {
  const { error } = await sb.from('inventario_descartados').delete().eq('codigo_sap', codigo_sap);
  if (error) { alert('No se pudo restaurar: ' + error.message); return; }
  await cargarDescartados();
  render();
}
function renderDescartados() {
  const filasHtml = descartados.length
    ? descartados.map(d => `
        <div class="fila">
          <div class="f-info">
            <div class="f-prod">${d.producto || d.codigo_sap}</div>
            <div class="f-meta">${d.categoria || 'Sin categoría'} · Código ${d.codigo_sap}</div>
            <div class="f-meta">Descartado por ${d.descartado_por_nombre || 'un usuario'} · ${fmtFecha(d.descartado_en)}${d.motivo ? ' · Motivo: ' + d.motivo : ''}</div>
          </div>
          <div class="f-datos">
            <button class="btn-mini" onclick="restaurarProducto('${d.codigo_sap}')">↩️ Restaurar a la lista</button>
          </div>
        </div>
      `).join('')
    : '<div class="vacio">No hay productos descartados todavía. Los que saques de "Seguimiento activo" con 🗑️ aparecen aquí, y puedes traerlos de vuelta cuando quieras.</div>';
  return `
    <div class="aviso">📦 Estos productos quedaron fuera de "Seguimiento activo" (y de sus alertas de stock bajo/agotado), pero <b>siguen existiendo normalmente en el inventario real</b> — descartarlos aquí no los borra ni afecta la carga de SAP, solo los oculta de este reporte. Restaura cualquiera cuando quieras que vuelva a aparecer.</div>
    <div class="card">${filasHtml}</div>
  `;
}
function badgeEstadoTexto(estado) {
  return { bajo: 'stock bajo', agotado: 'agotado' }[estado] || estado;
}
function render() {
  const tabsHtml = `
    <div class="filtros" style="margin-bottom:12px">
      <button class="filtro-chip ${vista === 'activos' ? 'act' : ''}" onclick="vista='activos'; render()">📋 Seguimiento activo</button>
      <button class="filtro-chip ${vista === 'descartados' ? 'act' : ''}" onclick="vista='descartados'; render()">📦 Descartados (${descartados.length})</button>
    </div>
  `;
  if (vista === 'descartados') {
    document.getElementById('wrap').innerHTML = tabsHtml + renderDescartados();
    return;
  }
  const activos = productos.filter(p => !descartadosSet().has(p.codigo_sap));
  const lista = aplicarFiltros(activos);
  const filasHtml = lista.length
    ? lista.map(p => {
        const estado = calcularEstado(p);
        const puedeReportar = estado === 'bajo' || estado === 'agotado';
        const urlReporte = puedeReportar
          ? `sugerido-compra.html?producto=${encodeURIComponent(p.producto)}&urgencia=${estado === 'agotado' ? 'Alta' : 'Normal'}&motivo=${encodeURIComponent('Detectado en Seguimiento de inventario (1.5): ' + badgeEstadoTexto(estado))}`
          : null;
        const sedesHtml = SEDES.map(s => `<span>${s}: ${fmtNum(p.porSede[s] || 0)}</span>`).join('');
        return `
          <div class="fila">
            <div class="f-info">
              <div class="f-prod">${p.producto || '(sin nombre)'}</div>
              <div class="f-meta">${p.categoria || 'Sin categoría'} · ${p.proveedor || 'Sin proveedor'} · Actualizado: ${fmtFecha(p.actualizado_en)}</div>
              <div class="f-sedes">${sedesHtml}</div>
            </div>
            <div class="f-datos">
              <div class="f-num"><b>${fmtNum(p.cantidad)}</b><span>total · ${p.unidad || 'unid.'}</span></div>
              <div class="f-num"><b>${p.stock_minimo_sugerido !== null && p.stock_minimo_sugerido !== undefined ? fmtNum(p.stock_minimo_sugerido) : '—'}</b><span>mínimo</span></div>
              <div class="f-num"><b>${p.stock_maximo_sugerido !== null && p.stock_maximo_sugerido !== undefined ? fmtNum(p.stock_maximo_sugerido) : '—'}</b><span>máximo</span></div>
              ${badgeEstado(estado)}
              ${urlReporte ? `<a class="btn-mini" href="${urlReporte}">📩 Reportar compra</a>` : ''}
              <button class="btn-mini" style="background:var(--vino)" onclick="descartarProducto('${p.codigo_sap}')" title="Quitar de esta lista — se puede restaurar después desde &quot;Descartados&quot;">🗑️ Descartar</button>
            </div>
          </div>
        `;
      }).join('')
    : '<div class="vacio">No hay productos que coincidan con el filtro.</div>';
  document.getElementById('wrap').innerHTML = `
    <div class="aviso">
      ℹ️ El stock y "última actualización" vienen de la carga real de SAP (por artículo y por sede, desde la Fase 25). El rango de <b>mínimo y máximo</b> se calcula con el histórico real de ventas del trimestre, pensado para compras mensuales: <b>mínimo</b> = (venta promedio diaria × 7 días, lo que tarda en llegar el pedido) + desviación estándar; <b>máximo</b> = ese mínimo + un mes completo de venta (promedio × 30). Ese umbral es sobre el <b>total combinado de las dos sedes</b> (todavía no hay ventas separadas por sede), por eso el estado (En rango / Stock bajo / etc.) siempre se calcula sobre el total, aunque abajo veas el desglose real por sede. Cuando el stock cae al mínimo o menos, ya toca comprar hasta llegar al máximo. Mientras no haya al menos 15 días de ventas registradas para un producto, se muestra "Sin datos suficientes" en vez de una alerta poco confiable. Un producto que no se vaya a volver a pedir se puede sacar de esta lista con 🗑️ Descartar, sin afectar el inventario real — queda guardado en la pestaña "📦 Descartados" por si se cambia de opinión.
    </div>
    ${tabsHtml}
    ${renderIndicadores(activos)}
    <div class="filtros">
      <select id="f-sede" onchange="filtroSede=this.value; render()">
        <option value="todas">Todas las sedes (total)</option>
        <option value="Chigorodó">Solo Chigorodó</option>
        <option value="Belén de Bajirá">Solo Belén de Bajirá</option>
      </select>
      <button class="filtro-chip ${filtroEstado === 'todos' ? 'act' : ''}" onclick="filtroEstado='todos'; render()">Todos</button>
      <button class="filtro-chip ${filtroEstado === 'ok' ? 'act' : ''}" onclick="filtroEstado='ok'; render()">OK</button>
      <button class="filtro-chip ${filtroEstado === 'bajo' ? 'act' : ''}" onclick="filtroEstado='bajo'; render()">Stock bajo</button>
      <button class="filtro-chip ${filtroEstado === 'agotado' ? 'act' : ''}" onclick="filtroEstado='agotado'; render()">Agotados</button>
      <button class="filtro-chip ${filtroEstado === 'sobre' ? 'act' : ''}" onclick="filtroEstado='sobre'; render()">Sobre stock</button>
      <input type="text" placeholder="Buscar producto..." value="${filtroTexto}" oninput="filtroTexto=this.value; render()">
    </div>
    <div class="card">${filasHtml}</div>
  `;
  document.getElementById('f-sede').value = filtroSede;
}
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  const userId = session.user.id;
  const [{ data: perfil }, { data: permisos }] = await Promise.all([
    sb.from('perfiles').select('*').eq('id', userId).single(),
    sb.from('permisos_modulo').select('*').eq('perfil_id', userId),
  ]);
  if (!perfil) {
    document.getElementById('wrap').innerHTML = '<div class="loading">Tu usuario no tiene un perfil configurado todavía.</div>';
    return;
  }
  miPerfil = perfil;
  esSuperAdmin = perfil.es_super_admin;
  const nivel1 = (permisos || []).find(p => p.modulo === 1)?.nivel || 'inactivo';
  const nivel2 = (permisos || []).find(p => p.modulo === 2)?.nivel || 'inactivo';
  const puedeVer = esSuperAdmin || nivel1 !== 'inactivo' || nivel2 !== 'inactivo';
  if (!puedeVer) {
    document.getElementById('wrap').innerHTML = '<div class="loading">No tienes permiso para ver este módulo.</div>';
    return;
  }
  // Fase 41b (20-sep): Supabase/PostgREST tope típico de 1000 filas por
  // consulta — con los 16 grupos reales confirmados, `inventario` puede
  // superar eso (mismo bug ya resuelto para `ventas` en resumen-venta.html
  // y gerencia-ventas.html, y para `inventario` en analisis-inventario.html).
  async function traerTodasLasPaginas(query) {
    const PAGINA = 1000;
    let filas = [];
    let desde = 0;
    while (true) {
      const { data, error } = await query.range(desde, desde + PAGINA - 1);
      if (error) return { data: null, error };
      filas = filas.concat(data || []);
      if (!data || data.length < PAGINA) break;
      desde += PAGINA;
    }
    return { data: filas, error: null };
  }
  const [{ data: inv, error: errInv }, { data: stock, error: errStock }] = await Promise.all([
    traerTodasLasPaginas(sb.from('inventario').select('*').order('producto', { ascending: true })),
    traerTodasLasPaginas(sb.from('vista_stock_sugerido').select('*')),
  ]);
  if (errInv) {
    document.getElementById('wrap').innerHTML = '<div class="loading">No se pudo cargar el inventario: ' + errInv.message + '</div>';
    return;
  }
  const stockPorCodigo = {};
  (stock || []).forEach(s => { stockPorCodigo[s.codigo_sap] = s; });
  productosPorSede = (inv || []).map(p => {
    const s = stockPorCodigo[p.codigo_sap];
    return {
      ...p,
      stock_minimo_sugerido: s ? s.stock_minimo_sugerido : null,
      stock_maximo_sugerido: s ? s.stock_maximo_sugerido : null,
    };
  });
  productos = agruparPorProducto(productosPorSede);
  await cargarDescartados();
  render();
})();
</script>
</body>
